<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 10 Widget 9 - Gradient Clipping</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#152033;--muted:#65758b;--line:#d9e2ef;--cyan:#0891b2;--violet:#7c3aed;--green:#159447;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,#f8fbff,#eef5fb);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.s10w9-w{max-width:1180px;margin:0 auto;padding:14px 22px 16px}
.s10w9-k{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.s10w9-w h1{font-size:24px;line-height:1.12;margin:3px 0 8px}
.s10w9-say{border:1px solid #fcd34d;background:#fffbeb;border-radius:10px;padding:9px 12px;color:#7c4a03;font-size:13.5px;line-height:1.5;margin:0 0 10px}
.s10w9-say b{color:#92400e;font-weight:800}
.s10w9-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.s10w9-sl{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700}
.s10w9-sl input{width:126px;vertical-align:middle;accent-color:var(--amber)}
.s10w9-sl b{font:800 12.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--amber);min-width:38px}
.s10w9-st{font-size:12px;font-weight:700;color:var(--muted)}
.s10w9-g{display:grid;grid-template-columns:1.9fr 1fr;gap:12px;align-items:start}
.s10w9-card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(20,42,75,.07);padding:11px 13px}
.s10w9-card h2{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:800}
.s10w9-card svg{display:block;width:100%;height:auto}
.s10w9-t{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
.s10w9-t th{text-align:right;font-size:9px;text-transform:uppercase;color:var(--muted);padding:3px 4px;border-bottom:1px solid var(--line);font-weight:800}
.s10w9-t td{padding:3px 4px;border-bottom:1px solid #eef2f7;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right;font-weight:700}
.s10w9-t th:first-child,.s10w9-t td:first-child{text-align:left;font-family:Inter,sans-serif;color:var(--muted);font-weight:700}
.s10w9-t tr.c td{color:var(--green)}
.s10w9-t tr.r td{color:var(--violet)}
.s10w9-met{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.s10w9-met div{border:1px solid var(--line);border-radius:8px;background:#fbfdff;padding:6px 8px}
.s10w9-met b{display:block;font:800 15px ui-monospace,SFMono-Regular,Consolas,monospace}
.s10w9-met span{display:block;color:var(--muted);font-size:10px;margin-top:1px}
.s10w9-note{margin:9px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.s10w9-note b{color:var(--ink)}
.s10w9-hd{font:800 10px Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase}
@media(max-width:940px){.s10w9-g{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="s10w9-w">
<div class="s10w9-k">ERA V5 Session 10 · guarding against one bad batch</div>
<h1>The gradient norm moves before the loss does</h1>
<p class="s10w9-say" id="s10w9-say"></p>
<div class="s10w9-bar">
<label class="s10w9-sl" for="s10w9-cap">clipping cap <input id="s10w9-cap" type="range" min="1" max="120" value="10" aria-label="Clipping cap on the gradient norm"><b id="s10w9-capv">1.00</b></label>
<label class="s10w9-sl" for="s10w9-spk">norm of the bad batch <input id="s10w9-spk" type="range" min="20" max="120" value="84" aria-label="Gradient norm produced by the one bad batch"><b id="s10w9-spkv">8.40</b></label>
<span class="s10w9-st" id="s10w9-status" aria-live="polite">Ready</span>
</div>
<section class="s10w9-g">
<div class="s10w9-card">
<h2>Two traces from the same run, on the same step axis</h2>
<svg id="s10w9-chart" viewBox="0 0 620 330" role="img" aria-label="Gradient norm and loss plotted against training step, showing the norm spiking before the loss reacts"></svg>
</div>
<div class="s10w9-card">
<h2>What the cap does to the bad batch</h2>
<svg id="s10w9-vec" viewBox="0 0 300 150" role="img" aria-label="The raw gradient arrow and the clipped gradient arrow lying on the same ray"></svg>
<table class="s10w9-t">
<tr><th>gradient</th><th>g1</th><th>g2</th><th>g3</th><th>length</th></tr>
<tr class="r"><td>raw</td><td id="s10w9-r1"></td><td id="s10w9-r2"></td><td id="s10w9-r3"></td><td id="s10w9-rn"></td></tr>
<tr class="c"><td>after clipping</td><td id="s10w9-c1"></td><td id="s10w9-c2"></td><td id="s10w9-c3"></td><td id="s10w9-cn"></td></tr>
</table>
<div class="s10w9-met">
<div><b id="s10w9-scale" style="color:var(--green)">0.119</b><span>every gradient times this</span></div>
<div><b id="s10w9-hits" style="color:var(--amber)">1</b><span>steps that got clipped</span></div>
</div>
<p class="s10w9-note" id="s10w9-note"></p>
</div>
</section>
</main>
<script>
(function(){
'use strict';
var N=40,SP=24,DIR=[0.75,0.5,0.4330127];
function $(i){return document.getElementById('s10w9-'+i);}
function rnd(i){var x=Math.sin(i*12.9898)*43758.5453;return x-Math.floor(x);}
function sim(cap,spk){
  var n=[],a=[],l=[3.2],i,d,hits=0;
  for(i=0;i<=N;i++)n.push(i===SP?spk:0.30+0.55*Math.exp(-i/14)+0.22*rnd(i));
  for(i=0;i<=N;i++){a.push(Math.min(n[i],cap));if(n[i]>cap)hits++;}
  for(i=0;i<N;i++){d=i>=1?Math.max(0,a[i-1]-1.2)*0.42:0;l.push(Math.max(0.35,l[i]*0.955)+d);}
  return {n:n,a:a,l:l,hits:hits};
}
function px(i){return 44+i/N*566;}
function yn(v){return 150-(Math.log(Math.max(0.1,Math.min(12,v)))/Math.LN10+1)/2.1*120;}
function poly(p,c,w,d){return '<polyline points="'+p+'" fill="none" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="'+d+'"':'')+' stroke-linejoin="round"/>';}
function tx(x,y,s,c,a,b){return '<text x="'+x+'" y="'+y+'" text-anchor="'+(a||'middle')+'" font-size="'+(b||9.5)+'" font-weight="700" fill="'+c+'">'+s+'</text>';}
function chart(m,mu,cap,react){
  var s='',i,mx=0,pr='',pa='',pl='',pu='',ycap=yn(cap);
  for(i=0;i<=N;i++)mx=Math.max(mx,m.l[i],mu.l[i]);mx*=1.12;
  s+=tx(44,15,'gradient norm, log scale','#7c3aed','start',10.5);
  s+=tx(44,196,'training loss','#dc2626','start',10.5);
  for(i=-1;i<=1;i++)s+='<line x1="44" y1="'+yn(Math.pow(10,i))+'" x2="610" y2="'+yn(Math.pow(10,i))+'" stroke="#eef3f9"/>'+tx(39,yn(Math.pow(10,i))+3.5,i<0?'0.1':i?'10':'1','#8b9aad','end');
  s+='<line x1="44" y1="300" x2="610" y2="300" stroke="#e6edf6"/>'+tx(39,303,'0','#8b9aad','end')+tx(39,208,mx.toFixed(1),'#8b9aad','end');
  s+='<rect x="44" y="'+ycap+'" width="566" height="'+(150-ycap)+'" fill="rgba(21,148,71,.06)"/>';
  s+='<line x1="44" y1="'+ycap+'" x2="610" y2="'+ycap+'" stroke="#159447" stroke-width="1.6" stroke-dasharray="6 4"/>';
  s+=tx(608,ycap-5,'cap '+cap.toFixed(2),'#159447','end');
  for(i=0;i<=N;i++){pr+=px(i).toFixed(1)+','+yn(m.n[i]).toFixed(1)+' ';pa+=px(i).toFixed(1)+','+yn(m.a[i]).toFixed(1)+' ';
    pl+=px(i).toFixed(1)+','+(300-m.l[i]/mx*92).toFixed(1)+' ';pu+=px(i).toFixed(1)+','+(300-mu.l[i]/mx*92).toFixed(1)+' ';}
  s+=poly(pr,'#c4b5fd',2.6)+poly(pa,'#7c3aed',2.6)+poly(pu,'#f0a3a3',2.2,'6 4')+poly(pl,'#dc2626',2.6);
  s+='<line x1="'+px(SP)+'" y1="26" x2="'+px(SP)+'" y2="300" stroke="#d97706" stroke-width="1.3" stroke-dasharray="3 3"/>';
  s+='<circle cx="'+px(SP)+'" cy="'+yn(m.n[SP])+'" r="4.2" fill="#7c3aed"/>'+tx(px(SP),yn(m.n[SP])-8,'norm '+m.n[SP].toFixed(2),'#5b21b6');
  s+=tx(px(SP),325,'step '+SP,'#b45309');
  if(react>0){s+='<line x1="'+px(react)+'" y1="200" x2="'+px(react)+'" y2="300" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="3 3"/>';
    s+='<circle cx="'+px(react)+'" cy="'+(300-mu.l[react]/mx*92).toFixed(1)+'" r="4.2" fill="#dc2626"/>';
    s+=tx(px(react)+4,325,'loss reacts at step '+react+', '+(react-SP)+' steps later','#b91c1c','start');}
  s+=tx(327,15,'raw norm in pale violet, norm after clipping in solid violet','#8b9aad');
  s+=tx(610,196,'solid: with the cap.  dashed: with no cap at all','#8b9aad','end');
  $('chart').innerHTML=s;
}
function vec(spk,cap,sc){
  var ax=Math.cos(-0.5),ay=Math.sin(-0.5),L1=spk/12*112,L2=Math.min(spk,cap)/12*112,s='';
  s+='<circle cx="26" cy="106" r="3" fill="#94a3b8"/>';
  s+='<line x1="26" y1="106" x2="'+(26+ax*L1)+'" y2="'+(106+ay*L1)+'" stroke="#c4b5fd" stroke-width="7" stroke-linecap="round"/>';
  s+='<line x1="26" y1="106" x2="'+(26+ax*L2)+'" y2="'+(106+ay*L2)+'" stroke="#159447" stroke-width="7" stroke-linecap="round"/>';
  s+=tx(26+ax*L1+8,106+ay*L1-6,'raw, length '+spk.toFixed(2),'#6d28d9','start',10.5);
  s+=tx(26+ax*L2+8,106+ay*L2+16,'clipped, length '+Math.min(spk,cap).toFixed(2),'#166534','start',10.5);
  s+=tx(26,130,'Both arrows lie on the same ray, so the direction','#8b9aad','start',10);
  s+=tx(26,143,'is untouched. Only the length changes, by x'+sc.toFixed(3),'#8b9aad','start',10);
  $('vec').innerHTML=s;
}
function draw(){
  var cap=+$('cap').value/10,spk=+$('spk').value/10,m=sim(cap,spk),mu=sim(1e9,spk),sc=Math.min(1,cap/spk),i,best=0,bd=0.02;
  for(i=1;i<=N;i++)if(mu.l[i]-mu.l[i-1]>bd){bd=mu.l[i]-mu.l[i-1];best=i;}
  $('capv').textContent=cap.toFixed(2);$('spkv').textContent=spk.toFixed(2);
  $('say').innerHTML='One batch out of '+(N+1)+' produces a gradient of length <b>'+spk.toFixed(2)+'</b> while the cap is <b>'+cap.toFixed(2)+'</b>. Every gradient in the model is multiplied by '+cap.toFixed(2)+' / '+spk.toFixed(2)+' = <b>'+sc.toFixed(3)+'</b>'+(sc<1?'.':', so nothing is held back.');
  for(i=0;i<3;i++){$('r'+(i+1)).textContent=(spk*DIR[i]).toFixed(3);$('c'+(i+1)).textContent=(spk*sc*DIR[i]).toFixed(3);}
  $('rn').textContent=spk.toFixed(3);$('cn').textContent=(spk*sc).toFixed(3);
  $('scale').textContent=sc.toFixed(3);$('hits').textContent=m.hits;
  $('note').innerHTML=(best>0?'The norm rose at step '+SP+'. The uncapped loss only rose at step '+best+', <b>'+(best-SP)+' steps later</b>. ':'')+'Peak loss reaches <b>'+Math.max.apply(null,m.l).toFixed(2)+'</b> with this cap and <b>'+Math.max.apply(null,mu.l).toFixed(2)+'</b> with no cap at all.';
  $('status').textContent=m.hits+' of '+(N+1)+' steps clipped. The norm is measured before the update, so it warns first.';
  chart(m,mu,cap,best);vec(spk,cap,sc);
}
$('cap').addEventListener('input',draw);$('spk').addEventListener('input',draw);
draw();
}());
</script>
<script>
(function(){
  var fe; try{ fe=window.frameElement; }catch(e){ return; }
  if(!fe) return;
  var last=0;
  function fit(){ var h=Math.ceil(document.body.scrollHeight)+8; if(Math.abs(h-last)>2){ last=h; fe.style.height=h+'px'; } }
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.body); }
  window.addEventListener('load',fit);
  document.addEventListener('click',function(){ setTimeout(fit,60); setTimeout(fit,260); },true);
  document.addEventListener('input',function(){ setTimeout(fit,60); },true);
  [0,120,400,900,1800].forEach(function(t){ setTimeout(fit,t); });
})();
</script>
</body>
</html>
