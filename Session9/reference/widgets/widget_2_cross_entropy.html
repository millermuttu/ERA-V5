<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Session 9 Widget 2 - Cross-Entropy</title>
<style>
:root{--ink:#152033;--muted:#65758b;--line:#d9e2ef;--violet:#7c3aed;--green:#159447;--red:#dc2626}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,#f8fbff,#eef5fb);color:var(--ink);font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1180px;margin:0 auto;padding:14px 18px 16px}
.k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--violet)}
h1{font-size:21px;line-height:1.12;margin:3px 0 4px}
.sub{color:var(--muted);max-width:980px;margin:0 0 10px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 26px rgba(20,42,75,.07);padding:12px}
.sliders{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:9px;align-items:end;margin-bottom:10px}
.lab{display:flex;justify-content:space-between;gap:6px;font-size:11px;font-weight:700;margin-bottom:2px}
.lab i{font-style:normal;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--violet);font-weight:800}
input[type=range]{width:100%;height:15px;margin:0;accent-color:var(--violet)}
button{border:1px solid var(--violet);background:#fff;color:var(--violet);border-radius:8px;padding:6px 12px;font:inherit;font-size:11.5px;font-weight:800;cursor:pointer}
.eq{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;background:#0f172a;color:#dbeafe;border-radius:8px;padding:8px 11px;line-height:1.6;white-space:pre;overflow-x:auto;margin:0 0 9px}
.eq b{color:#a5f3fc}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:11px;align-items:start}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:4px 5px;border-bottom:1px solid var(--line);font-weight:800}
td{padding:3px 5px;border-bottom:1px solid #eef2f7;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
td.lbl{font-family:inherit;font-weight:700}
tr.y td{background:#f0fdf4}
.svg{display:block;width:100%;height:auto}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.met{border:1px solid var(--line);border-radius:9px;background:#fbfdff;padding:7px;text-align:center}
.met b{display:block;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px}
.met span{display:block;color:var(--muted);font-size:9.5px;line-height:1.3;margin-top:3px}
.ok{border:1px solid #86efac;background:#f0fdf4;color:#14532d;border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;margin-top:9px}
.ok b{color:#166534;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.say{border:1px solid #c4b5fd;background:#f5f3ff;color:#4c1d95;border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;margin-top:9px}
.say b{color:#5b21b6;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
@media(max-width:980px){.two{grid-template-columns:1fr}.sliders{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="w">
  <div class="k">ERA V5 Session 9 &middot; Section 5</div>
  <h1>What probability did you give the right token?</h1>
  <p class="sub">Drag five logits and watch softmax, cross-entropy and the gradient move. The only question is how much probability landed on the correct token.</p>

  <section class="card">
    <div class="sliders" id="sliders"></div>
    <div class="eq" id="eq"></div>
    <div class="two">
      <div>
        <table>
          <thead><tr><th>i</th><th>token</th><th>logit z</th><th>p</th><th>analytic p - onehot</th><th>numeric central diff</th><th>abs difference</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="ok" id="ok"></div>
      </div>
      <div>
        <div id="curve"></div>
        <div class="mets" id="mets"></div>
        <div class="say" id="say"></div>
      </div>
    </div>
  </section>
</main>

<script>
(function(){
'use strict';
var TOK=['mat','floor','table','roof','chair'],N=5,Z0=[2.4,0.8,3.1,-0.5,1.2],Y=0,HS=1e-4;
var z=Z0.slice(),el=function(id){return document.getElementById(id);};
function f(x,p){return (x<0?'':' ')+x.toFixed(p);}
function ex(x){return Number(x).toExponential(2).replace(/e([+-])(\d)$/,'e$10$2');}
function softmax(a){var m=Math.max.apply(null,a),e=a.map(function(x){return Math.exp(x-m);}),t=e.reduce(function(p,q){return p+q;},0);return e.map(function(x){return x/t;});}
function loss(a){var m=Math.max.apply(null,a),s=0,i;for(i=0;i<N;i++)s+=Math.exp(a[i]-m);return -(a[Y]-m-Math.log(s));}
function curve(){
  var W=460,H=182,L=44,R=12,T=10,B=30,lo=-4,hi=6,i,pts=[],mx=1,d='';
  for(i=0;i<=200;i++){var v=lo+(hi-lo)*i/200,q=z.slice();q[Y]=v;var l=loss(q);pts.push([v,l]);if(l>mx)mx=l;}
  function X(v){return L+(v-lo)/(hi-lo)*(W-L-R);}
  function Yc(v){return T+(1-v/mx)*(H-T-B);}
  pts.forEach(function(p,k){d+=(k?' L ':'M ')+X(p[0]).toFixed(1)+' '+Yc(p[1]).toFixed(1);});
  var g='<rect x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'" fill="#fbfdff" stroke="#e8eef6"/>';
  for(i=0;i<=4;i++){var gv=mx*i/4;g+='<line x1="'+L+'" y1="'+Yc(gv).toFixed(1)+'" x2="'+(W-R)+'" y2="'+Yc(gv).toFixed(1)+'" stroke="#eef2f7"/><text x="'+(L-5)+'" y="'+(Yc(gv)+3.5).toFixed(1)+'" font-size="9" fill="#94a3b8" text-anchor="end" font-family="ui-monospace,monospace">'+gv.toFixed(1)+'</text>';}
  for(i=lo;i<=hi;i++)g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-B+13)+'" font-size="9" fill="#94a3b8" text-anchor="middle" font-family="ui-monospace,monospace">'+i+'</text>';
  var cz=z[Y],cl=loss(z);
  g+='<path d="'+d+'" fill="none" stroke="#7c3aed" stroke-width="2.2"/><line x1="'+X(cz).toFixed(1)+'" y1="'+T+'" x2="'+X(cz).toFixed(1)+'" y2="'+(H-B)+'" stroke="#159447" stroke-dasharray="3 3"/><circle cx="'+X(cz).toFixed(1)+'" cy="'+Yc(cl).toFixed(1)+'" r="5" fill="#159447"/><text x="'+Math.min(X(cz)+8,W-110).toFixed(1)+'" y="'+Math.max(Yc(cl)-8,T+11).toFixed(1)+'" font-size="11" font-weight="800" fill="#159447" font-family="ui-monospace,monospace">L = '+cl.toFixed(4)+'</text>';
  g+='<text x="'+(W/2)+'" y="'+(H-3)+'" font-size="9.5" fill="#65758b" text-anchor="middle">logit of the correct token, z[0] = mat</text><text x="8" y="'+(T+8)+'" font-size="9.5" fill="#65758b">loss, nats</text>';
  return '<svg class="svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Loss against the logit of the correct token, with the current value marked">'+g+'</svg>';
}
function render(){
  var p=softmax(z),L=loss(z),b='',i,mxd=0,at=0,sa=0,sn=0,g=[],n=[];
  for(i=0;i<N;i++){
    var zp=z.slice();zp[i]+=HS;var zm=z.slice();zm[i]-=HS;
    g.push(p[i]-(i===Y?1:0));n.push((loss(zp)-loss(zm))/(2*HS));
    var dd=Math.abs(g[i]-n[i]);if(dd>mxd){mxd=dd;at=i;}
    sa+=g[i];sn+=n[i];
    el('zv'+i).textContent=z[i].toFixed(2);
  }
  for(i=0;i<N;i++)b+='<tr'+(i===Y?' class="y"':'')+'><td>'+i+'</td><td class="lbl">'+TOK[i]+(i===Y?' ● correct':'')+'</td><td>'+f(z[i],2)+'</td><td>'+p[i].toFixed(6)+'</td><td>'+f(g[i],9)+'</td><td>'+f(n[i],9)+'</td><td>'+ex(Math.abs(g[i]-n[i]))+'</td></tr>';
  b+='<tr><td></td><td class="lbl">sum</td><td></td><td>'+p.reduce(function(x,y){return x+y;},0).toFixed(6)+'</td><td>'+ex(sa)+'</td><td>'+ex(sn)+'</td><td></td></tr>';
  el('rows').innerHTML=b;
  el('eq').innerHTML='L = -log softmax(z)[0] = -log('+p[Y].toFixed(6)+') = <b>'+L.toFixed(6)+'</b> nats\nanalytic   dL/dz_i = softmax(z)_i - onehot(0)_i\nnumeric    dL/dz_i ~ ( L(z + h e_i) - L(z - h e_i) ) / (2h)      h = 1e-4';
  el('curve').innerHTML=curve();
  el('mets').innerHTML='<div class="met"><b>'+(p[Y]*100).toFixed(2)+'%</b><span>probability on the correct token</span></div>'+
    '<div class="met"><b>'+L.toFixed(4)+'</b><span>loss in nats</span></div>'+
    '<div class="met"><b>'+(L/Math.LN2).toFixed(4)+'</b><span>loss in bits</span></div>'+
    '<div class="met"><b>'+Math.exp(L).toFixed(2)+'</b><span>perplexity of this one token</span></div>';
  el('ok').innerHTML='<b>Checked in this page.</b> Every analytic value matches its central finite difference to <b>'+ex(mxd)+'</b>, worst at i = '+at+' (&ldquo;'+TOK[at]+'&rdquo;). The five analytic values sum to <b>'+ex(sa)+'</b>, which is what makes the update a redistribution of probability mass.';
  el('say').innerHTML='The backward pass through softmax and log is <b>one subtraction</b>. The correct logit carries a gradient of <b>'+f(g[Y],6)+'</b>, so descent pushes it up, and every wrong logit gets its own probability back as a push down.';
}
el('sliders').innerHTML=TOK.map(function(t,i){return '<div><div class="lab">z['+i+'] '+t+' <i id="zv'+i+'"></i></div><input id="z'+i+'" type="range" min="-600" max="600" step="1" value="'+Math.round(Z0[i]*100)+'" aria-label="logit for the token '+t+', from minus 6 to plus 6"></div>';}).join('')+
  '<button id="reset" type="button" aria-label="Reset the five logits to their starting values">Reset</button>';
TOK.forEach(function(t,i){el('z'+i).addEventListener('input',function(){z[i]=(+this.value)/100;render();});});
el('reset').addEventListener('click',function(){z=Z0.slice();TOK.forEach(function(t,i){el('z'+i).value=Math.round(Z0[i]*100);});render();});
render();
})();
</script>
<script>
/* Self-sizing: the lesson embeds this at a fixed height and the content height moves. Same origin, so the frame is resized from inside. Nothing here takes focus. */
(function(){
  var fe;try{fe=window.frameElement;}catch(e){return;}
  if(!fe)return;
  var last=0;
  function fit(){var h=Math.ceil(document.body.scrollHeight)+8;if(Math.abs(h-last)>2){last=h;fe.style.height=h+'px';}}
  if(window.ResizeObserver)new ResizeObserver(fit).observe(document.body);
  window.addEventListener('load',fit);
  document.addEventListener('click',function(){setTimeout(fit,60);setTimeout(fit,260);},true);
  document.addEventListener('input',function(){setTimeout(fit,60);},true);
  [0,120,400,900,1800].forEach(function(t){setTimeout(fit,t);});
})();
</script>
</body>
</html>
