<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 11 Widget 1 - Gradient Descent in Two Dimensions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#152033;--muted:#65758b;--line:#d9e2ef;--cyan:#0891b2;--violet:#7c3aed;--green:#159447;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,#f8fbff,#eef5fb);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.s11w1-w{max-width:1180px;margin:0 auto;padding:14px 22px 16px}
.s11w1-k{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--violet)}
.s11w1-w h1{font-size:24px;line-height:1.12;margin:3px 0 8px}
.s11w1-say{border:1px solid #ddd6fe;background:#f5f3ff;border-radius:10px;padding:9px 12px;color:#4c1d95;font-size:13.5px;line-height:1.5;margin:0 0 10px}
.s11w1-say b{color:#5b21b6;font-weight:800}
.s11w1-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.s11w1-sl{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700}
.s11w1-sl input{width:190px;vertical-align:middle;accent-color:var(--violet)}
.s11w1-sl b{font:800 12.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--violet);min-width:44px}
.s11w1-st{font-size:12px;font-weight:700;color:var(--muted)}
.s11w1-g{display:grid;grid-template-columns:1.42fr 1fr;gap:12px;align-items:start}
.s11w1-card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(20,42,75,.07);padding:11px 13px}
.s11w1-card h2{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;font-weight:800}
.s11w1-card h2 i{font-style:normal;text-transform:none;letter-spacing:0}
.s11w1-card svg{display:block;width:100%;height:auto}
.s11w1-met{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.s11w1-met div{border:1px solid var(--line);border-radius:8px;background:#fbfdff;padding:6px 8px}
.s11w1-met b{display:block;font:800 17px ui-monospace,SFMono-Regular,Consolas,monospace}
.s11w1-met span{display:block;color:var(--muted);font-size:10px;margin-top:1px}
.s11w1-t{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:9px}
.s11w1-t th{text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:3px 4px;border-bottom:1px solid var(--line);font-weight:800}
.s11w1-t td{padding:3px 4px;border-bottom:1px solid #eef2f7;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right;font-weight:700}
.s11w1-t th:first-child,.s11w1-t td:first-child{text-align:left;font-family:Inter,sans-serif;color:var(--muted);font-weight:700}
.s11w1-t tr.f td{background:#f5f3ff;color:#5b21b6}
.s11w1-note{margin:9px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.s11w1-note b{color:var(--ink)}
.s11w1-foot{margin-top:12px}
.s11w1-foot p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.s11w1-foot b{color:var(--ink)}
@media(max-width:940px){.s11w1-g{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="s11w1-w">
<div class="s11w1-k">ERA V5 Session 11 · one learning rate for two directions</div>
<h1>Gradient descent in two dimensions</h1>
<p class="s11w1-say" id="s11w1-say"></p>
<div class="s11w1-bar">
<label class="s11w1-sl" for="s11w1-eta">learning rate <input id="s11w1-eta" type="range" min="5" max="130" step="1" value="90" aria-label="Learning rate eta, from 0.005 to 0.130"><b id="s11w1-etav">0.090</b></label>
<span class="s11w1-st" id="s11w1-status" aria-live="polite"></span>
</div>
<section class="s11w1-g">
<div class="s11w1-card">
<h2>Contours of <i>L = 0.5(20u&sup2; + v&sup2;)</i>, with the five steps from (1, 1)</h2>
<svg id="s11w1-chart" viewBox="0 0 620 330" role="img" aria-label="Contour map of the loss surface with the gradient descent path drawn as connected dots"></svg>
<p class="s11w1-note" id="s11w1-cnote"></p>
</div>
<div class="s11w1-card">
<h2>Per-step multipliers and the position after five steps</h2>
<div class="s11w1-met">
<div><b id="s11w1-mu" style="color:var(--violet)"></b><span>u multiplier, 1 &minus; 20&eta;</span></div>
<div><b id="s11w1-mv" style="color:var(--cyan)"></b><span>v multiplier, 1 &minus; &eta;</span></div>
<div><b id="s11w1-u5" style="color:var(--violet)"></b><span>u after 5 steps</span></div>
<div><b id="s11w1-v5" style="color:var(--cyan)"></b><span>v after 5 steps</span></div>
</div>
<table class="s11w1-t" id="s11w1-tab"></table>
<p class="s11w1-note" id="s11w1-tnote"></p>
</div>
</section>
<section class="s11w1-card s11w1-foot">
<p id="s11w1-foot"></p>
</section>
</main>
<script>
(function(){
'use strict';
var STEPS=5,U0=1,V0=1,KU=20,KV=1,RAT=Math.sqrt(KU/KV),
    LFT=48,TOP=20,PW=564,PH=282,UMIN=-2.8,UMAX=2.8,VMIN=-1.15,VMAX=1.3,
    US=PW/(UMAX-UMIN),VS=PH/(VMAX-VMIN),
    CONT=[0.14,0.28,0.45,0.65,0.88,1.15,1.5,1.95,2.5];
function $(i){return document.getElementById('s11w1-'+i);}
function px(u){return LFT+(u-UMIN)*US;}
function py(v){return TOP+(VMAX-v)*VS;}
function loss(u,v){return 0.5*(KU*u*u+KV*v*v);}
function sgn2(x){return (x>0?'+':'')+x.toFixed(2);}
function f4(x){return x.toFixed(4);}
function inside(u,v){return u>=UMIN&&u<=UMAX&&v>=VMIN&&v<=VMAX;}
function tx(x,y,s,c,a,b,w){return '<text x="'+x+'" y="'+y+'" text-anchor="'+(a||'middle')+'" font-size="'+(b||9.5)+'" font-weight="'+(w||700)+'" fill="'+c+'">'+s+'</text>';}
function path(mu,mv){
  var p=[[U0,V0]],i,u=U0,v=V0;
  for(i=0;i<STEPS;i++){u=u*mu;v=v*mv;p.push([u,v]);}
  return p;
}
function chart(p,off){
  var s='',i,a,pts='',aS=Math.sqrt(loss(U0,V0)/(0.5*KU));
  s+='<defs><clipPath id="s11w1-cp"><rect x="'+LFT+'" y="'+TOP+'" width="'+PW+'" height="'+PH+'"/></clipPath></defs>';
  s+='<rect x="'+LFT+'" y="'+TOP+'" width="'+PW+'" height="'+PH+'" fill="#fbfdff" stroke="#e6edf6"/>';
  s+='<g clip-path="url(#s11w1-cp)">';
  for(i=0;i<CONT.length;i++){a=CONT[i];
    s+='<ellipse cx="'+px(0).toFixed(1)+'" cy="'+py(0).toFixed(1)+'" rx="'+(a*US).toFixed(1)+'" ry="'+(RAT*a*VS).toFixed(1)+'" fill="none" stroke="#dbe4f0" stroke-width="1.4"/>';}
  s+='<ellipse cx="'+px(0).toFixed(1)+'" cy="'+py(0).toFixed(1)+'" rx="'+(aS*US).toFixed(1)+'" ry="'+(RAT*aS*VS).toFixed(1)+'" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="5 4"/>';
  s+='</g>';
  s+='<line x1="'+LFT+'" y1="'+py(0).toFixed(1)+'" x2="'+(LFT+PW)+'" y2="'+py(0).toFixed(1)+'" stroke="#cbd5e1"/>';
  s+='<line x1="'+px(0).toFixed(1)+'" y1="'+TOP+'" x2="'+px(0).toFixed(1)+'" y2="'+(TOP+PH)+'" stroke="#cbd5e1"/>';
  for(i=-2;i<=2;i++)if(i)s+=tx(px(i),TOP+PH+13,String(i),'#8b9aad');
  for(i=-1;i<=1;i++)if(i)s+=tx(LFT-6,py(i)+3.5,String(i),'#8b9aad','end');
  s+=tx(LFT-6,py(0)+3.5,'0','#8b9aad','end');
  s+='<circle cx="'+px(0).toFixed(1)+'" cy="'+py(0).toFixed(1)+'" r="4" fill="#159447"/>';
  s+=tx(px(0)+8,py(0)+13,'minimum of the loss, L = 0','#159447','start',10);
  for(i=0;i<p.length;i++)pts+=px(p[i][0]).toFixed(1)+','+py(p[i][1]).toFixed(1)+' ';
  s+='<g clip-path="url(#s11w1-cp)"><polyline points="'+pts+'" fill="none" stroke="#7c3aed" stroke-width="2.2" stroke-linejoin="round"/></g>';
  for(i=0;i<p.length;i++){if(!inside(p[i][0],p[i][1]))continue;
    s+='<circle cx="'+px(p[i][0]).toFixed(1)+'" cy="'+py(p[i][1]).toFixed(1)+'" r="'+(i?3.9:5.2)+'" fill="'+(i?'#7c3aed':'#0891b2')+'"/>';
    s+=tx(px(p[i][0]),py(p[i][1])+(i%2?15:-10),String(i),i?'#5b21b6':'#0e7490','middle',10,800);}
  s+=tx(px(U0)+11,py(V0)-2,'start (1, 1)','#0e7490','start',10.5,800);
  s+=tx(LFT+PW/2,TOP+PH+27,'u, the steep direction','#8b9aad','middle',10.5);
  s+='<text x="13" y="'+(TOP+PH/2)+'" transform="rotate(-90 13 '+(TOP+PH/2)+')" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8b9aad">v, the shallow direction</text>';
  if(off.length)s+=tx(LFT+PW-6,TOP+14,'step '+off.join(' and ')+' left the chart','#dc2626','end',10.5,800);
  $('chart').innerHTML=s;
}
function draw(){
  var eta=+$('eta').value/1000,mu=1-KU*eta,mv=1-KV*eta,p=path(mu,mv),i,q,
      off=[],rows='<tr><th>step</th><th>u</th><th>v</th><th>L</th></tr>';
  for(i=0;i<p.length;i++){q=p[i];if(!inside(q[0],q[1]))off.push(i);
    rows+='<tr'+(i===STEPS?' class="f"':'')+'><td>'+i+'</td><td>'+f4(q[0])+'</td><td>'+f4(q[1])+'</td><td>'+loss(q[0],q[1]).toFixed(4)+'</td></tr>';}
  $('tab').innerHTML=rows;
  $('etav').textContent=eta.toFixed(3);
  $('mu').textContent=sgn2(mu);
  $('mv').textContent=mv.toFixed(2);
  $('u5').textContent=f4(p[STEPS][0]);
  $('v5').textContent=f4(p[STEPS][1]);
  $('say').innerHTML='Every step multiplies u by (1 &minus; 20&eta;) = <b>'+sgn2(mu)+'</b> and v by (1 &minus; &eta;) = <b>'+mv.toFixed(2)+'</b>. Starting from (1, 1), after five steps u is <b>'+f4(p[STEPS][0])+'</b> and v is <b>'+f4(p[STEPS][1])+'</b>.';
  var am=Math.abs(mu),st;
  if(am<1e-9)st='u lands exactly on the bottom in a single step, then stays there.';
  else if(mu>0)st='u keeps its sign and shrinks by a factor of '+am.toFixed(2)+' each step. This is the crawling regime.';
  else if(am<1)st='u flips sign every step and shrinks by a factor of '+am.toFixed(2)+'. Oscillating and still converging.';
  else if(Math.abs(am-1)<1e-9)st='u flips sign every step and holds the same size forever.';
  else st='u flips sign every step and grows by a factor of '+am.toFixed(2)+'. Diverging.';
  $('status').textContent=st;
  $('cnote').innerHTML='Each dot is the position after one step, joined in order. The dashed violet ellipse is the contour through the start, so a dot inside it has a lower loss than the start had.';
  $('tnote').innerHTML='Both coordinates use the same &eta;. The u column reacts twenty times harder to it because the curvature along u is twenty times larger.';
  var need=Math.ceil(Math.log(0.1)/Math.log(mv));
  $('foot').innerHTML='u sets the ceiling on the learning rate: past <b>&eta; = 0.100</b> the factor (1 &minus; 20&eta;) drops below &minus;1 and u grows without limit. v sets the floor: at the current &eta; it gives up only <b>'+(eta*100).toFixed(1)+'%</b> of its distance per step, so it needs <b>'+need+'</b> steps to fall below 0.100. No single value serves both columns.';
  chart(p,off);
}
$('eta').addEventListener('input',draw);
draw();
}());
</script>
<script>
(function(){
  var fe; try{ fe=window.frameElement; }catch(e){ return; }
  if(!fe) return;
  var last=0;
  function fit(){ var h=Math.ceil(document.body.scrollHeight)+8; if(Math.abs(h-last)>2){ last=h; fe.style.height=h+'px'; } }
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.body); }
  window.addEventListener('load',fit);
  document.addEventListener('click',function(){ setTimeout(fit,60); setTimeout(fit,260); },true);
  document.addEventListener('input',function(){ setTimeout(fit,60); },true);
  [0,120,400,900,1800].forEach(function(t){ setTimeout(fit,t); });
})();
</script>
</body>
</html>
