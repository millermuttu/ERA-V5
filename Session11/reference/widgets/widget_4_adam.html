<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 11 Widget 4 - Adam</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#152033;--muted:#65758b;--line:#d9e2ef;--cyan:#0891b2;--violet:#7c3aed;--green:#159447;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,#f8fbff,#eef5fb);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.s11w4-w{max-width:1180px;margin:0 auto;padding:14px 22px 16px}
.s11w4-k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.s11w4-w h1{font-size:24px;line-height:1.12;margin:4px 0 9px}
.s11w4-card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(20,42,75,.07);padding:12px 14px}
.s11w4-card h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:800}
.s11w4-say{border:1px solid #a5f3fc;background:#ecfeff;border-radius:10px;padding:10px 13px;color:#134e57;font-size:14.5px;line-height:1.5;margin:0 0 11px}
.s11w4-say b{color:#0e5f70;font-weight:800}
.s11w4-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.s11w4-bar button{border:1px solid var(--cyan);background:var(--cyan);color:#fff;border-radius:8px;padding:7px 16px;font:800 12.5px Inter,sans-serif;cursor:pointer}
.s11w4-bar button.g{background:#fff;color:var(--cyan)}
.s11w4-bar button:disabled{opacity:.42;cursor:default}
.s11w4-sl{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.s11w4-sl input[type=checkbox]{width:15px;height:15px;accent-color:var(--cyan)}
.s11w4-sl select{border:0;background:transparent;font:800 12px Inter,sans-serif;color:var(--cyan);cursor:pointer;outline:none}
.s11w4-sl.on{border-color:var(--cyan);background:#ecfeff}
.s11w4-st{font-size:12px;font-weight:700;color:var(--muted)}
.s11w4-g{display:grid;grid-template-columns:1.62fr 1fr;gap:13px;align-items:start}
.s11w4-g svg{display:block;width:100%;height:auto}
.s11w4-t{width:100%;border-collapse:collapse}
.s11w4-t th{text-align:right;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:800;padding:2px 4px;border-bottom:1px solid var(--line)}
.s11w4-t td{padding:5px 4px;border-bottom:1px solid #eef2f7;font:800 12.5px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right;color:var(--ink)}
.s11w4-t th:first-child,.s11w4-t td:first-child{text-align:left;color:var(--muted)}
.s11w4-t td.g{color:var(--violet)}
.s11w4-t th.s,.s11w4-t td.s{background:#fffbeb}
.s11w4-t td.s{color:#b45309}
.s11w4-t th.s{color:#b45309}
.s11w4-t td.w{color:var(--green)}
.s11w4-t tr.off td{color:#c3cede}
.s11w4-t tr.off td.s{color:#e8d9b8}
.s11w4-t tr.now td{background:#f0fbff}
.s11w4-t tr.now td.s{background:#fef3c7}
.s11w4-eq{font:800 13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;background:#0f172a;color:#dbeafe;border-radius:9px;padding:8px 11px;margin-top:9px;white-space:pre;overflow-x:auto}
.s11w4-eq i{color:#7dd3fc;font-style:normal}
.s11w4-eq u{color:#fbbf24;text-decoration:none}
.s11w4-sign{margin:9px 0 0;font-size:12.5px;font-weight:700;color:var(--cyan);border-left:3px solid var(--cyan);padding-left:9px;line-height:1.45}
.s11w4-note{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.s11w4-note b{color:var(--ink)}
.s11w4-foot{margin-top:11px}
.s11w4-foot p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.s11w4-foot b{color:var(--ink)}
.s11w4-ax{font:700 9.5px Inter,sans-serif;fill:#8b9aad}
.s11w4-pl{font:800 10.5px ui-monospace,SFMono-Regular,Consolas,monospace}
@media(max-width:980px){.s11w4-g{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="s11w4-w">
<div class="s11w4-k">ERA V5 Session 11 · adam</div>
<h1>Adam</h1>
<p class="s11w4-say" id="s11w4-say"></p>
<div class="s11w4-bar">
<button id="s11w4-next" type="button" aria-label="Take the next Adam step and fill in the next table row">Take one step</button>
<button id="s11w4-reset" class="g" type="button" aria-label="Return the weight to 1.0 and clear the table">Start over</button>
<label class="s11w4-sl" id="s11w4-bcl" for="s11w4-bc"><input id="s11w4-bc" type="checkbox" checked aria-label="Apply bias correction to both moving averages"> bias correction</label>
<label class="s11w4-sl" for="s11w4-pre">gradients <select id="s11w4-pre" aria-label="Choose the sequence of five gradients"><option value="0">0.50, 0.40, 0.60, 0.45, 0.55</option><option value="1">0.0050, 0.0040, 0.0060, 0.0045, 0.0055</option><option value="2">0.50, -0.40, 0.60, -0.45, 0.55</option></select></label>
<span class="s11w4-st" id="s11w4-status" aria-live="polite"></span>
</div>
<section class="s11w4-g">
<div class="s11w4-card">
<h2>Every intermediate number, one row per step. eta = 1e-3, beta1 = 0.9, beta2 = 0.999, eps = 1e-8</h2>
<table class="s11w4-t">
<thead><tr><th>t</th><th>g</th><th>m</th><th>v</th><th>m-hat</th><th>v-hat</th><th class="s">step</th><th>w</th></tr></thead>
<tbody id="s11w4-rows"></tbody>
</table>
<p class="s11w4-note" id="s11w4-tnote"></p>
</div>
<div class="s11w4-card">
<h2>Step size divided by eta</h2>
<svg id="s11w4-chart" viewBox="0 0 400 170" role="img" aria-label="Bar chart of each step size divided by the learning rate, against a reference line at one"></svg>
<div class="s11w4-eq" id="s11w4-eq"></div>
<p class="s11w4-sign" id="s11w4-sign"></p>
</div>
</section>
<section class="s11w4-card s11w4-foot">
<p id="s11w4-foot"></p>
</section>
</main>
<script>
(function(){
'use strict';
var ETA=1e-3,B1=0.9,B2=0.999,EPS=1e-8,W0=1.0,N=5,
    PRE=[[0.50,0.40,0.60,0.45,0.55],[0.0050,0.0040,0.0060,0.0045,0.0055],[0.50,-0.40,0.60,-0.45,0.55]],
    done=0;
function $(i){return document.getElementById('s11w4-'+i);}
function fx(v,d){return v.toFixed(d);}
function fm(x){return Math.abs(x)<1e-4?x.toExponential(3):x.toFixed(4);}
function fv(x){return Math.abs(x)<1e-5?x.toExponential(3):x.toFixed(6);}
function fh(x){var a=Math.abs(x);return a<1e-5?x.toExponential(3):a<0.01?x.toFixed(6):x.toFixed(4);}
function run(gs,bc){
  var m=0,v=0,w=W0,out=[],t,g,mh,vh,st;
  for(t=1;t<=N;t++){
    g=gs[t-1];
    m=B1*m+(1-B1)*g;
    v=B2*v+(1-B2)*g*g;
    mh=bc?m/(1-Math.pow(B1,t)):m;
    vh=bc?v/(1-Math.pow(B2,t)):v;
    st=-ETA*mh/(Math.sqrt(vh)+EPS);
    w+=st;
    out.push({t:t,g:g,m:m,v:v,mh:mh,vh:vh,st:st,w:w,r:st/ETA});
  }
  return out;
}
function chart(rows){
  var L=34,R=10,TP=22,B=26,iw=400-L-R,ih=170-TP-B,i,mx=1,hi,s='',x,bw,y,z,r,
      NICE=[1.2,1.6,2,3,4,6,8,12,20];
  for(i=0;i<done;i++)mx=Math.max(mx,Math.abs(rows[i].r));
  hi=NICE[NICE.length-1];
  for(i=0;i<NICE.length;i++){if(NICE[i]>=mx*1.12){hi=NICE[i];break;}}
  function py(v){return TP+ih-v/hi*ih;}
  z=py(0);bw=iw/N*0.52;
  for(i=0;i<=4;i++){y=TP+ih-i/4*ih;s+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(400-R)+'" y2="'+y.toFixed(1)+'" stroke="#eef3f9"/><text x="'+(L-5)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" class="s11w4-ax">'+(hi*i/4).toFixed(hi>=4?1:2)+'</text>';}
  for(i=0;i<N;i++){
    x=L+(i+0.5)/N*iw;r=i<done?Math.abs(rows[i].r):0;y=i<done?py(r):z-3;
    s+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,z-y).toFixed(1)+'" rx="2" fill="'+(i<done?(Math.abs(r-1)<0.02?'#0891b2':'#d97706'):'#e2e8f0')+'"/>';
    if(i<done)s+='<text x="'+x.toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" class="s11w4-pl" fill="'+(Math.abs(r-1)<0.02?'#0891b2':'#b45309')+'">'+r.toFixed(4)+'</text>';
    s+='<text x="'+x.toFixed(1)+'" y="'+(z+13)+'" text-anchor="middle" class="s11w4-ax">t='+(i+1)+'</text>';
  }
  s+='<line x1="'+L+'" y1="'+z+'" x2="'+(400-R)+'" y2="'+z+'" stroke="#c3cede"/>';
  s+='<line x1="'+L+'" y1="'+py(1).toFixed(1)+'" x2="'+(400-R)+'" y2="'+py(1).toFixed(1)+'" stroke="#159447" stroke-width="2" stroke-dasharray="5 4"/>';
  s+='<text x="'+L+'" y="'+(TP-8)+'" class="s11w4-ax" fill="#159447">green dashes mark one learning rate</text>';
  $('chart').innerHTML=s;
}
function draw(){
  var bc=$('bc').checked,gs=PRE[+$('pre').value],rows=run(gs,bc),i,r,h='',cls,worst=0,k;
  for(i=0;i<N;i++){
    r=rows[i];cls=i<done?(i===done-1?'now':''):'off';
    h+='<tr class="'+cls+'"><td>'+r.t+'</td>'+(i<done
      ?'<td class="g">'+fx(r.g,4)+'</td><td>'+fm(r.m)+'</td><td>'+fv(r.v)+'</td><td>'+fh(r.mh)+'</td><td>'+fh(r.vh)+'</td><td class="s">'+fx(r.st,6)+'</td><td class="w">'+fx(r.w,6)+'</td>'
      :'<td class="g">'+fx(r.g,4)+'</td><td>.</td><td>.</td><td>.</td><td>.</td><td class="s">.</td><td>.</td>')+'</tr>';
  }
  $('rows').innerHTML=h;
  for(i=0;i<done;i++)worst=Math.max(worst,Math.abs(Math.abs(rows[i].r)-1));
  $('bcl').className='s11w4-sl'+(bc?' on':'');
  $('next').disabled=done>=N;
  $('status').textContent=done===0?'The weight sits at '+W0.toFixed(6)+'. No step taken yet.':done+' of '+N+' steps taken. w = '+fx(rows[done-1].w,6)+'.';
  k=done?rows[done-1]:null;
  $('say').innerHTML=done===0
    ?'One weight starts at <b>'+W0.toFixed(1)+'</b>. Adam keeps a moving average of the gradient in <b>m</b> and of the squared gradient in <b>v</b>, divides one by the square root of the other, and multiplies by eta. Take a step to fill the first row.'
    :'At step <b>'+k.t+'</b> the gradient was <b>'+fx(k.g,4)+'</b>. That gave m = <b>'+fm(k.m)+'</b> and v = <b>'+fv(k.v)+'</b>, so the weight moved by <b>'+fx(k.st,6)+'</b>, which is <b>'+Math.abs(k.r).toFixed(4)+'</b> times eta.';
  $('eq').innerHTML=done===0
    ?'m ← <i>0.9</i> m + <i>0.1</i> g\nv ← <i>0.999</i> v + <i>0.001</i> g²\nstep = −eta · m-hat ÷ (√v-hat + eps)'
    :'m-hat  <i>'+fh(k.mh)+'</i>\n√v-hat <i>'+fh(Math.sqrt(k.vh))+'</i>\nratio  <u>'+(k.mh/(Math.sqrt(k.vh)+EPS)).toFixed(4)+'</u>\nstep   <u>'+fx(k.st,6)+'</u> = '+Math.abs(k.r).toFixed(4)+' eta';
  $('sign').textContent=done===0
    ?(bc?'Bias correction is on. Both averages are divided by 1 − beta^t, which repairs the pull towards zero that a start at zero creates.':'Bias correction is off. m and v are both still close to zero at step 1, and v is pulled down far harder than m, so the first step comes out much too large.')
    :(bc?'With bias correction the largest deviation from one learning rate across the '+done+' step'+(done===1?'':'s')+' taken is '+(worst*100).toFixed(2)+' percent.':'Without bias correction the first step came out '+Math.abs(rows[0].r).toFixed(4)+' times eta. The largest deviation so far is '+(worst*100).toFixed(1)+' percent.');
  var lo=1e9,hi2=0;
  for(i=0;i<done;i++){lo=Math.min(lo,Math.abs(rows[i].r));hi2=Math.max(hi2,Math.abs(rows[i].r));}
  $('tnote').innerHTML=done===0
    ?'The <b>step</b> column is the one to watch. The gradients queued up range from '+fx(Math.min.apply(null,gs),4)+' to '+fx(Math.max.apply(null,gs),4)+'.'
    :'The <b>step</b> column is the one to watch. Gradients from '+fx(Math.min.apply(null,gs),4)+' to '+fx(Math.max.apply(null,gs),4)+' have produced steps between <b>'+lo.toFixed(4)+'</b> and <b>'+hi2.toFixed(4)+'</b> times eta.';
  $('foot').innerHTML=bc
    ?'The gradient chooses the direction and eta chooses the distance. Bias correction divides m by 1 − 0.9<sup>t</sup> and v by 1 − 0.999<sup>t</sup>, so at t = 1 the ratio is exactly <b>'+Math.abs(run(gs,true)[0].r).toFixed(4)+'</b> times eta whatever the first gradient happens to be. '+(+$('pre').value===1?'These gradients are a hundred times smaller than the first preset and the step column is identical to the digit.':'Switch the preset to gradients a hundred times smaller and the step column comes out identical to the digit.')
    :'At t = 1 both averages hold a single observation. m is g × 0.1 and v is g² × 0.001, so m ÷ √v comes to √(0.1²/0.001) = <b>'+Math.abs(run(gs,false)[0].r).toFixed(4)+'</b> whatever g was. Turn bias correction on and that first step drops to exactly one eta.';
  chart(rows);
}
$('next').addEventListener('click',function(){if(done<N){done++;draw();}});
$('reset').addEventListener('click',function(){done=0;draw();});
$('bc').addEventListener('change',draw);
$('pre').addEventListener('change',function(){done=0;draw();});
draw();
}());
</script>
<script>
(function(){
  var fe; try{ fe=window.frameElement; }catch(e){ return; }
  if(!fe) return;
  var last=0;
  function fit(){ var h=Math.ceil(document.body.scrollHeight)+8; if(Math.abs(h-last)>2){ last=h; fe.style.height=h+'px'; } }
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.body); }
  window.addEventListener('load',fit);
  document.addEventListener('click',function(){ setTimeout(fit,60); setTimeout(fit,260); },true);
  document.addEventListener('input',function(){ setTimeout(fit,60); },true);
  [0,120,400,900,1800].forEach(function(t){ setTimeout(fit,t); });
})();
</script>
</body>
</html>
