<style>
  :root{
    --ink:#0B1310; --ink-2:#0F1A15; --surface:#111E18;
    --line:rgba(233,231,220,0.10); --line-strong:rgba(233,231,220,0.18);
    --text:#ECEAE1; --muted:#8A9A92; --muted-2:#63736B;
    --jade:#4FC58C; --jade-bright:#79E6B0; --jade-dim:rgba(79,197,140,0.16);
    --ochre:#B8923E; --ochre-ground:#2A2414; --amber:#E0A03A; --rust:#E0693D;
    --pad-hatch: repeating-linear-gradient(-45deg, rgba(184,146,62,0.55) 0 1.5px, rgba(184,146,62,0.0) 1.5px 8px), var(--ochre-ground);
    --gone: rgba(233,231,220,0.05);
    --maxw:1120px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--ink);color:var(--text);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
  ::selection{background:rgba(79,197,140,.25)}

  .rail{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:rgba(255,255,255,.03)}
  .rail i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--jade),var(--jade-bright));transition:width .15s linear}
  .brand{position:fixed;left:22px;bottom:18px;z-index:50;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);display:flex;gap:8px;align-items:center;background:rgba(11,19,16,.7);padding:6px 10px;border-radius:999px;backdrop-filter:blur(6px)}
  .brand b{color:var(--jade)}

  .wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 26px}
  section{padding:64px 0;border-top:1px solid var(--line)}
  section:first-of-type{border-top:none}

  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--jade);font-weight:500;display:inline-flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--jade);opacity:.7}
  .eyebrow.amber{color:var(--amber)} .eyebrow.amber::before{background:var(--amber)}
  h1{font-family:"Archivo",sans-serif;font-weight:900;letter-spacing:-.02em;line-height:.98;font-size:clamp(38px,6vw,80px)}
  h2{font-family:"Archivo",sans-serif;font-weight:800;letter-spacing:-.015em;line-height:1.04;font-size:clamp(26px,3.4vw,44px)}
  h3{font-family:"Archivo",sans-serif;font-weight:700;letter-spacing:-.01em;font-size:clamp(17px,1.5vw,20px)}
  .lede{font-size:clamp(16px,1.35vw,19px);color:var(--muted);max-width:64ch;font-weight:400}
  .mono{font-family:"IBM Plex Mono",monospace}
  .jade{color:var(--jade-bright)} .amber{color:var(--amber)} .rust{color:var(--rust)}
  strong,b{color:var(--text);font-weight:700}
  .sub{color:var(--muted)}

  /* HERO */
  .hero{padding-top:96px}
  .hero h1{margin:18px 0 22px}
  .hero .thesis{color:var(--jade-bright)}
  .flow{display:grid;grid-template-columns:1fr auto 1fr;gap:28px;align-items:end;margin:38px 0 10px}
  .flow .end{text-align:right}
  .flow .lbl{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-bottom:8px}
  .flow .big{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums;font-size:clamp(40px,7vw,84px);line-height:.85;letter-spacing:-.04em}
  .flow .arrow{font-family:"IBM Plex Mono";color:var(--muted-2);font-size:22px;padding-bottom:14px}
  .flow .end .big{color:var(--jade-bright)}
  .reduc{margin-top:6px;font-family:"IBM Plex Mono";font-size:13px;color:var(--muted)}
  .reduc b{color:var(--rust)}

  /* survival bar */
  .track{position:relative;height:26px;border-radius:4px;background:var(--gone);overflow:hidden;display:flex}
  .seg{height:100%;transition:width 1.05s cubic-bezier(.2,.75,.2,1)}
  .seg.keep{background:linear-gradient(90deg,var(--jade),#3AA774)}
  .seg.cut{background:var(--pad-hatch)}
  .seg.prev{background:var(--gone)}
  .legend{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
  .lg{display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);letter-spacing:.03em}
  .sw{width:24px;height:11px;border-radius:2px}
  .sw.keep{background:linear-gradient(90deg,var(--jade),#3AA774)} .sw.cut{background:var(--pad-hatch)} .sw.prev{background:var(--gone);border:1px solid var(--line-strong)}

  /* dataset */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px}
  .card{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--surface)}
  .card .k{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--jade);margin-bottom:9px}
  .card .big{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;letter-spacing:-.02em;color:var(--text);line-height:1}
  .card p{font-size:12.5px;color:var(--muted);margin-top:6px}
  .dsrow{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start;margin-top:26px}
  .kv{width:100%;border-collapse:collapse;font-size:14px}
  .kv td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .kv td.k{font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);width:120px;white-space:nowrap}
  .kv td.v{color:var(--text)} .kv td.v b{color:var(--jade-bright)}

  /* strategies grid */
  .strat{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:26px}
  .st{display:grid;grid-template-columns:44px 1fr;gap:16px;border:1px solid var(--line);border-radius:11px;padding:16px 18px;background:var(--surface);border-left:3px solid var(--jade)}
  .st.demo{border-left-color:var(--amber)} .st.inherit{border-left-color:var(--muted-2);opacity:.9}
  .st .no{font-family:"IBM Plex Mono";font-weight:600;font-size:20px;color:var(--jade)}
  .st.demo .no{color:var(--amber)} .st.inherit .no{color:var(--muted-2)}
  .st h3{font-size:16px;margin-bottom:3px}
  .st p{font-size:13px;color:var(--muted)}
  .st .fix{display:block;margin-top:7px;font-family:"IBM Plex Mono";font-size:11px;color:var(--muted-2);letter-spacing:.02em}
  .st .fix b{color:var(--amber);font-weight:500}
  .pill{display:inline-block;font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted-2);margin-left:8px;vertical-align:middle}
  .pill.demo{color:var(--amber);border-color:rgba(224,160,58,.4)} .pill.inh{color:var(--muted-2)}

  /* pipeline stages */
  .stage{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:24px;margin-top:18px}
  .stage .top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;margin-bottom:6px}
  .stage .no{font-family:"IBM Plex Mono";color:var(--jade);font-size:13px;letter-spacing:.1em}
  .stage h3{font-size:21px}
  .stage .concern{font-size:13.5px;color:var(--muted);max-width:70ch;margin:8px 0 18px}
  .metrics{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:16px}
  .metric .n{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;color:var(--text)}
  .metric .n.cut{color:var(--rust)}
  .metric .l{font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);margin-top:3px}
  .diff{margin-top:14px;border:1px solid var(--line);border-radius:9px;overflow:hidden;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
  .diff .dh{padding:7px 13px;background:rgba(255,255,255,.02);color:var(--muted-2);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid var(--line)}
  .diff .db{padding:12px 13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--muted)}
  .diff .db.before{border-bottom:1px dashed var(--line)}
  .diff .db.after{color:var(--text)}
  .mark{background:rgba(224,105,61,.22);color:#F0B49A;border-radius:3px;padding:0 2px}
  .keepmark{background:rgba(79,197,140,.20);color:var(--jade-bright);border-radius:3px;padding:0 2px}
  .drop{color:var(--rust)}

  /* concerns */
  .conc{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}
  .cc{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--surface);border-top:2px solid var(--amber)}
  .cc .big{font-family:"IBM Plex Mono";font-size:34px;font-weight:600;color:var(--amber);line-height:1}
  .cc h3{margin:10px 0 6px;font-size:16px}
  .cc p{font-size:13px;color:var(--muted)}

  /* ghost demo */
  .ghost{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
  .gcol{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:18px;font-family:"IBM Plex Mono";font-size:12.5px}
  .gcol .h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
  .gcol.pre .h{color:var(--rust)} .gcol.post .h{color:var(--jade-bright)}
  .gline{padding:7px 10px;border-radius:6px;margin-bottom:7px;background:rgba(255,255,255,.02);color:var(--muted)}
  .gtok{color:var(--rust)} .gtok.ok{color:var(--jade-bright)}

  /* final + manifest */
  .final{display:grid;grid-template-columns:.85fr 1.15fr;gap:36px;align-items:start;margin-top:26px}
  .bigstats{display:grid;gap:14px}
  .bs{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--surface);display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  .bs .n{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;color:var(--jade-bright)}
  .bs .l{font-size:13px;color:var(--muted);text-align:right;max-width:20ch}
  .manifest{border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--ink-2)}
  .manifest .mh{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
  .manifest .mh .t{font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--jade)}
  .status{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
  .status.ok{color:#06120C;background:var(--jade)} .status.blocked{color:#fff;background:var(--rust)}
  pre.man{padding:16px 18px;font-family:"IBM Plex Mono";font-size:12px;line-height:1.65;color:var(--muted);overflow-x:auto;max-height:420px}
  pre.man .key{color:var(--jade)} pre.man .str{color:var(--text)} pre.man .num{color:var(--amber)}
  .btn{margin-top:14px;display:inline-flex;align-items:center;gap:9px;font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.06em;color:var(--text);background:var(--jade-dim);border:1px solid rgba(79,197,140,.4);border-radius:8px;padding:11px 16px;cursor:pointer;transition:.2s;text-transform:uppercase}
  .btn:hover{background:rgba(79,197,140,.24);border-color:var(--jade)}
  .btn:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

  .foot{color:var(--muted-2);font-size:12.5px;font-family:"IBM Plex Mono";letter-spacing:.03em;line-height:1.9}
  .foot b{color:var(--muted)}

  @media (max-width:820px){
    .cards{grid-template-columns:repeat(2,1fr)} .strat,.conc,.ghost{grid-template-columns:1fr}
    .flow{grid-template-columns:1fr;gap:14px} .flow .end{text-align:left} .flow .arrow{display:none}
    .dsrow,.final{grid-template-columns:1fr;gap:24px}
  }
  @media (prefers-reduced-motion:reduce){ .seg{transition:none} .rail i{transition:none} }
</style>

<script>
"use strict";
const STATS = JSON.parse(document.getElementById("stats").textContent);

/* ---------- helpers ---------- */
const fmt = n => (n==null?"—":n.toLocaleString("en-US"));
const abbr = n => {
  if(n==null) return "—";
  if(n>=1e6) return (n/1e6).toFixed(n>=1e7?1:2)+"M";
  if(n>=1e3) return (n/1e3).toFixed(1)+"k";
  return ""+n;
};
const pct = n => (n==null?"—":n.toFixed(n<10?2:1)+"%");
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };

/* ---------- static copy: the 8 strategies ---------- */
const STRATEGIES = [
  {n:"01", key:"normalize", kind:"applied", title:"Text normalization",
   blurb:"NFC, strip zero-width & control noise, unescape HTML entities, collapse whitespace (joiners preserved for any script).",
   fix:"character-level dirt & garbage tokens"},
  {n:"02", key:null, kind:"demo", title:"Format discipline",
   blurb:"Rewrite every conversation source into one canonical special-token format so pretraining never learns the ghost markers.",
   fix:"4 sources → 4 incompatible chat formats"},
  {n:"03", key:"quality", kind:"applied", title:"Quality filtering",
   blurb:"A heuristic cascade: length, symbol ratio, boilerplate/nav lines, duplicate-line ratio, mean word length.",
   fix:"junk pages leaking into the corpus"},
  {n:"04", key:"dedup", kind:"applied", title:"Deduplication",
   blurb:"MinHash signatures + LSH banding to catch near-duplicates, not just exact copies — the syndicated reposts.",
   fix:"undeduplicated crawl → wasted compute + memorization"},
  {n:"05", key:"langid", kind:"applied", title:"Language-ID validation",
   blurb:"Detect real English prose by script ratio + stop-word density, so non-English and non-prose docs are dropped.",
   fix:"mislabelled documents skewing the pools"},
  {n:"06", key:"pii", kind:"applied", title:"PII removal",
   blurb:"Regex masks emails, phones, URLs and IPs across every document; name NER shown as a demo.",
   fix:"personal data & legal usability"},
  {n:"07", key:"decontam", kind:"applied", title:"Decontamination",
   blurb:"Fingerprint a held-out eval set, remove any training doc overlapping it, plant canary strings.",
   fix:"benchmark scores that quietly inflate"},
  {n:"08", key:"manifest", kind:"applied", title:"Reproducibility & manifest",
   blurb:"Deterministic content hash after cleaning, plus a provenance manifest no shard can skip.",
   fix:"copy-pasted sizes & non-deterministic ids"},
];
const STAGE_TITLE = {normalize:"Text normalization", langid:"Language-ID validation",
  quality:"Quality filtering", dedup:"Deduplication", pii:"PII removal", decontam:"Decontamination"};
const STAGE_NO = {normalize:"01", quality:"03", dedup:"04", langid:"05", pii:"06", decontam:"07"};

/* ---------- render ---------- */
const app = document.getElementById("app");
const B = STATS.baseline, F = STATS.final, M = STATS.manifest, meta = STATS.meta;

/* HERO */
(() => {
  const s = el("section","hero");
  const removed = B.tokens - F.tokens;
  s.appendChild(el("div","eyebrow","CC-News · CommonCrawl · English"));
  s.innerHTML += `
    <h1>Raw data is <span class="thesis">not</span><br>training data.</h1>
    <p class="lede">A 20-million-token slice of an undeduplicated news crawl, run through eight cleaning
    strategies until what is left is something you could actually train on — every number below is measured,
    not estimated.</p>
    <div class="flow">
      <div class="start"><div class="lbl">Raw crawl</div><div class="big mono">${abbr(B.tokens)}</div></div>
      <div class="arrow">→</div>
      <div class="end"><div class="lbl">Clean training text</div><div class="big mono">${abbr(F.tokens)}</div></div>
    </div>
    <div class="track" data-bar>
      <div class="seg keep" data-w="${F.tokens/B.tokens*100}"></div>
      <div class="seg cut" data-w="${removed/B.tokens*100}"></div>
    </div>
    <div class="legend">
      <span class="lg"><span class="sw keep"></span>survived — ${fmt(F.tokens)} tokens</span>
      <span class="lg"><span class="sw cut"></span>removed — ${fmt(removed)} tokens (<b class="rust">${pct(F.total_reduction_pct)}</b>)</span>
    </div>`;
  app.appendChild(s);
})();

/* DATASET */
(() => {
  const s = el("section");
  s.innerHTML = `<div class="eyebrow">The dataset</div>
    <h2 style="margin:14px 0 10px">Why this corpus</h2>
    <p class="lede">Curated corpora are already deduplicated, so the interesting stages never fire on them.
    We took <b>CC-News</b> — CommonCrawl news — precisely because it is <b>undeduplicated</b>: the same wire
    story is syndicated across dozens of outlets, so near-duplicates, emails and phone numbers are really there.</p>
    <div class="cards">
      <div class="card"><div class="k">Documents</div><div class="big mono">${fmt(B.docs)}</div><p>raw crawl records</p></div>
      <div class="card"><div class="k">Tokens</div><div class="big mono">${abbr(B.tokens)}</div><p>o200k reference count</p></div>
      <div class="card"><div class="k">Fertility</div><div class="big mono">${B.fertility}</div><p>tokens / word</p></div>
      <div class="card"><div class="k">Words</div><div class="big mono">${abbr(B.words)}</div><p>whitespace-split</p></div>
    </div>
    <div class="dsrow">
      <table class="kv">
        <tr><td class="k">Source</td><td class="v mono">${esc(meta.source)}</td></tr>
        <tr><td class="k">License</td><td class="v"><b>${esc(meta.license)}</b></td></tr>
        <tr><td class="k">Language</td><td class="v">English — <span class="mono">${esc(meta.language)}</span> · CommonCrawl news articles</td></tr>
        <tr><td class="k">Selection</td><td class="v">first documents until 20M o200k tokens · streamed</td></tr>
      </table>
      <div>
        <div class="eyebrow amber" style="margin-bottom:12px">The one rule underneath</div>
        <p class="sub" style="font-size:14.5px">Cleaning happens <b>before</b> the content hash, so the manifest
        fingerprints the cleaned text — not the dirty original. And nothing is assumed clean: every stage runs
        independently, which is how <b class="jade">deduplication</b> quietly reclaims 14% of the corpus the
        source never removed.</p>
      </div>
    </div>`;
  app.appendChild(s);
})();

/* STRATEGIES */
(() => {
  const s = el("section");
  s.innerHTML = `<div class="eyebrow">The count</div>
    <h2 style="margin:14px 0 10px">Eight strategies</h2>
    <p class="lede">Session 4 builds eight cleaning strategies (extraction is a ninth stage, inherited from
    Session 3). Seven are applied for real to this corpus; format discipline is a conversation-data strategy,
    shown here as a demo.</p>`;
  const grid = el("div","strat");
  STRATEGIES.forEach(st => {
    const card = el("div","st"+(st.kind==="demo"?" demo":""));
    const pill = st.kind==="demo" ? '<span class="pill demo">demo</span>' : "";
    card.innerHTML = `<div class="no">${st.n}</div>
      <div><h3>${st.title}${pill}</h3><p>${st.blurb}</p>
      <span class="fix">fixes: <b>${st.fix}</b></span></div>`;
    grid.appendChild(card);
  });
  s.appendChild(grid);
  app.appendChild(s);
})();

/* PIPELINE WALKTHROUGH */
(() => {
  const s = el("section");
  s.innerHTML = `<div class="eyebrow">What was cleaned · why · how</div>
    <h2 style="margin:14px 0 10px">The pipeline, stage by stage</h2>
    <p class="lede">Each stage names what it removes, shows the real before→after counts, and carries an example
    from the corpus. The bar is the surviving-token spine: <span class="jade">what is left</span>,
    <span class="amber">what this stage cut</span>, and what earlier stages already removed.</p>`;

  let priorRemoved = 0;
  STATS.stages.forEach(stg => {
    const cutPct = stg.removed_tokens / B.tokens * 100;
    const keepPct = stg.tokens_out / B.tokens * 100;
    let metrics = `
        <div class="metric"><div class="n">${fmt(stg.docs_in)} → ${fmt(stg.docs_out)}</div><div class="l">documents</div></div>
        <div class="metric"><div class="n">${abbr(stg.tokens_in)} → ${abbr(stg.tokens_out)}</div><div class="l">tokens</div></div>`;
    if(stg.name === "normalize"){
      metrics += `
        <div class="metric"><div class="n cut">${fmt(stg.zero_width_noise_removed)}</div><div class="l">zero-width stripped</div></div>
        <div class="metric"><div class="n">${fmt(stg.docs_modified)}</div><div class="l">docs cleaned</div></div>`;
    } else {
      metrics += `
        <div class="metric"><div class="n cut">−${fmt(stg.removed_docs)}</div><div class="l">docs removed</div></div>
        <div class="metric"><div class="n cut">${pct(stg.removed_pct)}</div><div class="l">tokens cut</div></div>`;
    }
    const note = (stg.name === "dedup" && stg.removed_docs === 0)
      ? `<p class="concern" style="color:var(--jade-bright)">✓ Verified 0 near-duplicates — this corpus is already globally deduplicated. The stage still ran; it just had nothing to cut.</p>`
      : "";
    const div = el("div","stage");
    div.innerHTML = `
      <div class="top">
        <div><span class="no">STAGE ${STAGE_NO[stg.name]||""}</span>
          <h3>${STAGE_TITLE[stg.name]||stg.name}</h3></div>
      </div>
      <p class="concern">${esc(stg.indic_concern)}</p>
      <div class="metrics">${metrics}</div>
      ${note}
      <div class="track" data-bar>
        <div class="seg keep" data-w="${keepPct}"></div>
        <div class="seg cut" data-w="${cutPct}"></div>
        <div class="seg prev" data-w="${priorRemoved}"></div>
      </div>`;
    // example diff
    const d = (stg.example_diffs||[])[0];
    if(d){
      const box = el("div","diff");
      const beforeTxt = esc(d.before);
      const afterTxt = d.after.startsWith("[DROPPED") || d.after.startsWith("[")
        ? `<span class="drop">${esc(d.after)}</span>` : esc(d.after);
      box.innerHTML = `<div class="dh">example — before</div>
        <div class="db before">${beforeTxt}${d.before.length>=400?" …":""}</div>
        <div class="dh">after</div><div class="db after">${afterTxt}</div>`;
      div.appendChild(box);
    }
    s.appendChild(div);
    priorRemoved += cutPct;
  });

  // PII breakdown
  const p = STATS.pii;
  const pii = el("div","stage");
  pii.innerHTML = `<div class="top"><div><span class="no">STAGE 06 · detail</span>
    <h3>What the PII pass masked</h3></div></div>
    <div class="metrics">
      <div class="metric"><div class="n">${fmt(p.email)}</div><div class="l">emails</div></div>
      <div class="metric"><div class="n">${fmt(p.phone)}</div><div class="l">phones</div></div>
      <div class="metric"><div class="n">${fmt(p.url)}</div><div class="l">urls</div></div>
      <div class="metric"><div class="n">${fmt(p.ip)}</div><div class="l">ip addrs</div></div>
      <div class="metric"><div class="n" style="color:var(--amber)">demo</div><div class="l">names (NER)</div></div>
    </div>
    <p class="concern">Structured identifiers are masked by regex, fully and precisely, across every document —
    thousands of emails, phone numbers and URLs. Personal-name detection is shown as a demo to keep the run
    fast and dependency-light; an English NER pass would slot in here for production.</p>`;
  s.appendChild(pii);
  app.appendChild(s);
})();

/* GHOST-TAG DEMO */
(() => {
  const s = el("section");
  s.innerHTML = `<div class="eyebrow amber">Strategy 02 · demo</div>
    <h2 style="margin:14px 0 10px">The ghost-tag trap</h2>
    <p class="lede">Our corpus is web text, so format discipline doesn’t apply to it directly — but it is one of
    the eight. Four sources arrive in four incompatible chat formats; left as literal characters they teach the
    model a fake conversation structure that later fights the real special tokens. The fix is to rewrite every
    source into one canonical format.</p>
    <div class="ghost">
      <div class="gcol pre"><div class="h">Four sources → ghost markers in pretraining</div>
        <div class="gline"><span class="gtok">[INST]</span> … <span class="gtok">[/INST]</span></div>
        <div class="gline"><span class="gtok">&lt;user&gt;</span> … <span class="gtok">&lt;/user&gt;</span></div>
        <div class="gline"><span class="gtok">### Human:</span> … <span class="gtok">### Assistant:</span></div>
        <div class="gline"><span class="gtok">Human:</span> … <span class="gtok">AI:</span></div>
      </div>
      <div class="gcol post"><div class="h">One canonical special-token format</div>
        <div class="gline"><span class="gtok ok">&lt;|user|&gt;</span> … <span class="gtok ok">&lt;|assistant|&gt;</span></div>
        <div class="gline"><span class="gtok ok">&lt;|user|&gt;</span> … <span class="gtok ok">&lt;|assistant|&gt;</span></div>
        <div class="gline"><span class="gtok ok">&lt;|user|&gt;</span> … <span class="gtok ok">&lt;|assistant|&gt;</span></div>
        <div class="gline"><span class="gtok ok">&lt;|user|&gt;</span> … <span class="gtok ok">&lt;|assistant|&gt;</span></div>
      </div>
    </div>`;
  app.appendChild(s);
})();

/* CONCERNS */
(() => {
  const s = el("section");
  const dd = STATS.stages.find(x => x.name === "dedup") || {};
  const dc = STATS.stages.find(x => x.name === "decontam") || {};
  const p = STATS.pii;
  const piiTotal = p.email + p.phone + p.url + p.ip;
  s.innerHTML = `<div class="eyebrow amber">What the pipeline caught</div>
    <h2 style="margin:14px 0 10px">Where the cleaning actually bit</h2>
    <div class="conc">
      <div class="cc"><div class="big">${pct(dd.removed_pct)}</div><h3>Syndication is duplication</h3>
        <p>The same wire story is republished across dozens of outlets. MinHash+LSH removed
        ${fmt(dd.removed_docs)} near-duplicate documents that exact hashing would have missed entirely.</p></div>
      <div class="cc"><div class="big">${abbr(piiTotal)}</div><h3>PII at scale, by regex</h3>
        <p>${fmt(p.email)} emails, ${fmt(p.phone)} phone numbers and ${fmt(p.url)} URLs masked across the
        corpus — the structured identifiers regex catches precisely, at every document.</p></div>
      <div class="cc"><div class="big">${fmt(dc.holdout_docs || 0)} held</div><h3>The eval firewall</h3>
        <p>${fmt(dc.holdout_docs || 0)} documents were held out as an evaluation set. Decontamination removed
        them and every training doc sharing a verbatim 13-word run — ${fmt(dc.removed_docs)} in all.</p></div>
      <div class="cc"><div class="big">${B.fertility}</div><h3>No corpus maxes every stage</h3>
        <p>English tokenizes at ${B.fertility} tokens/word and is character-clean, so normalization does little
        here. Which stages bite is a property of the data — you run all of them regardless.</p></div>
    </div>`;
  app.appendChild(s);
})();

/* FINAL + MANIFEST */
(() => {
  const s = el("section");
  const v = M.validation || {blocked:false};
  const status = v.blocked ? `<span class="status blocked">Blocked</span>` : `<span class="status ok">Cleared</span>`;
  // pretty-print manifest with light syntax coloring
  const manObj = Object.assign({}, M); delete manObj.validation;
  let manStr = JSON.stringify(manObj, null, 2);
  manStr = esc(manStr)
    .replace(/&quot;([^&]+?)&quot;:/g, '<span class="key">&quot;$1&quot;</span>:')
    .replace(/: (\d+(?:\.\d+)?)/g, ': <span class="num">$1</span>');
  s.innerHTML = `<div class="eyebrow">Final statistics</div>
    <h2 style="margin:14px 0 10px">What survived, and its provenance</h2>
    <div class="final">
      <div class="bigstats">
        <div class="bs"><div class="n mono">${fmt(F.docs)}</div><div class="l">clean documents<br><span class="sub">from ${fmt(B.docs)}</span></div></div>
        <div class="bs"><div class="n mono">${abbr(F.tokens)}</div><div class="l">clean tokens<br><span class="sub">${fmt(F.tokens)}</span></div></div>
        <div class="bs"><div class="n mono">${pct(F.total_reduction_pct)}</div><div class="l">of raw tokens removed</div></div>
        <div class="bs"><div class="n mono">${F.fertility}</div><div class="l">final fertility (tok/word)</div></div>
      </div>
      <div class="manifest">
        <div class="mh"><span class="t">shard manifest</span>${status}</div>
        <pre class="man">${manStr}</pre>
      </div>
    </div>
    <button class="btn" id="dl">↓ Download manifest.json</button>
    <p class="foot" style="margin-top:30px">
      <b>Reproduce:</b> fetch_ccnews_slice.py → run_pipeline.py → build_widget.py &nbsp;·&nbsp;
      content hash over cleaned text &nbsp;·&nbsp; generated <span class="mono">${esc((meta.generated_at||"").slice(0,19))}Z</span><br>
      Session 04 · ERA · Data Cleaning &amp; Deduplication — English news corpus, CC-News (CommonCrawl).
    </p>`;
  app.appendChild(s);
  s.querySelector("#dl").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(manObj, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "manifest.json"; a.click();
    URL.revokeObjectURL(a.href);
  });
})();

/* ---------- animations ---------- */
// scroll progress rail
const rail = document.getElementById("rail");
const onScroll = () => {
  const h = document.documentElement;
  const p = h.scrollTop / (h.scrollHeight - h.clientHeight || 1);
  rail.style.width = (p*100).toFixed(1)+"%";
};
document.addEventListener("scroll", onScroll, {passive:true}); onScroll();

// bars fill when scrolled into view
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if(!e.isIntersecting) return;
    e.target.querySelectorAll(".seg").forEach(seg => { seg.style.width = (+seg.dataset.w)+"%"; });
    io.unobserve(e.target);
  });
}, {threshold:0.35});
document.querySelectorAll("[data-bar]").forEach(b => io.observe(b));
</script>
</body>
</html>
