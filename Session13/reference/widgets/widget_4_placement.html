<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 13 Widget 4 - Topology-Aware Placement</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#152033;--muted:#65758b;--line:#d9e2ef;--cyan:#0891b2;--violet:#7c3aed;--green:#159447;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,#f8fbff,#eef5fb);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.s13w4-w{max-width:1180px;margin:0 auto;padding:14px 22px 16px}
.s13w4-k{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.s13w4-w h1{font-size:24px;line-height:1.12;margin:3px 0 8px}
.s13w4-say{border:1px solid #bae6f0;background:#f0fbfd;border-radius:10px;padding:9px 12px;color:#155e75;font-size:13.5px;line-height:1.5;margin:0 0 10px}
.s13w4-say b{color:#0e7490;font-weight:800}
.s13w4-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.s13w4-lb{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.s13w4-bar button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 14px;font:800 11.5px Inter,sans-serif;cursor:pointer}
.s13w4-bar button.s13w4-t{min-width:42px}
.s13w4-bar button.s13w4-t.on{border-color:var(--cyan);color:#0e7490;background:#effbfe;box-shadow:inset 0 0 0 1px var(--cyan)}
.s13w4-bar button.s13w4-d.on,.s13w4-bar button.s13w4-n.on{border-color:var(--ink);color:var(--ink);background:#eef2f7;box-shadow:inset 0 0 0 1px var(--ink)}
.s13w4-sep{width:1px;height:20px;background:var(--line);margin:0 5px}
.s13w4-card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(20,42,75,.07);padding:11px 14px 10px}
.s13w4-card h2{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:800}
.s13w4-card svg{display:block;width:100%;height:auto}
.s13w4-leg{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.4}
.s13w4-leg b{color:var(--ink)}
.s13w4-met{display:grid;grid-template-columns:.8fr 1.4fr 1fr;gap:8px;margin-top:10px}
.s13w4-box{border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.9);padding:7px 10px}
.s13w4-box>span:not(.s13w4-rd){display:block;color:var(--muted);font-size:10.5px;line-height:1.3;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.s13w4-rd{display:block;margin-top:3px;font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s13w4-rd b{font-size:17px;font-weight:800;color:var(--ink)}
.s13w4-tbox{margin-top:8px}
.s13w4-trow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.s13w4-trow .s13w4-rd{margin-top:0}
.s13w4-tl{font-size:10.5px;color:var(--muted);line-height:1.3;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.s13w4-tk{position:relative;height:22px;margin-top:5px;border-radius:7px;background:#f4f7fb;border:1px solid #e4ebf4;
 background-image:repeating-linear-gradient(to right,#dde6f2 0,#dde6f2 1px,transparent 1px,transparent 16.6667%)}
.s13w4-fl{position:absolute;left:0;top:3px;bottom:3px;border-radius:5px;transition:width .4s ease-in-out,background-color .4s}
.s13w4-ax{position:relative;height:13px;margin-top:2px}
.s13w4-ax i{position:absolute;top:0;transform:translateX(-50%);font:700 9.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:#93a3b6;font-style:normal;white-space:nowrap}
.s13w4-ax i:first-child{transform:none}.s13w4-ax i:last-child{transform:translateX(-100%)}
.s13w4-note{margin:9px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink);min-height:38px}
.s13w4-note span{display:block}
@media(max-width:940px){.s13w4-met{grid-template-columns:1fr}.s13w4-rd{white-space:normal}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="s13w4-w">
<div class="s13w4-k">ERA V5 Session 13 &middot; topology-aware placement</div>
<h1>Topology-Aware Placement</h1>
<p class="s13w4-say" id="s13w4-say"></p>

<div class="s13w4-bar">
<span class="s13w4-lb">nodes</span>
<button type="button" class="s13w4-n" data-v="h100" aria-label="H100 nodes with NVLink 4 at 450 gigabytes per second each way">H100 nodes</button>
<button type="button" class="s13w4-n" data-v="b200" aria-label="B200 nodes with NVLink 5 at 900 gigabytes per second each way">B200 nodes</button>
<span class="s13w4-sep" aria-hidden="true"></span>
<span class="s13w4-lb">TP degree</span>
<button type="button" class="s13w4-t" data-v="2" aria-label="Tensor-parallel degree 2">2</button>
<button type="button" class="s13w4-t" data-v="4" aria-label="Tensor-parallel degree 4">4</button>
<button type="button" class="s13w4-t" data-v="8" aria-label="Tensor-parallel degree 8">8</button>
<button type="button" class="s13w4-t" data-v="16" aria-label="Tensor-parallel degree 16">16</button>
<span class="s13w4-sep" aria-hidden="true"></span>
<span class="s13w4-lb">traffic</span>
<button type="button" class="s13w4-d" data-v="tp" aria-label="Show tensor-parallel traffic">tensor parallel</button>
<button type="button" class="s13w4-d" data-v="dp" aria-label="Show data-parallel traffic">data parallel</button>
</div>

<div class="s13w4-card">
<h2 id="s13w4-h2">64 GPUs in 8 nodes</h2>
<svg id="s13w4-svg" viewBox="0 0 1136 222" role="img" aria-label="Eight nodes of eight GPUs, with GPU position k of every node wired to rail switch k"></svg>
<p class="s13w4-leg" id="s13w4-leg"></p>
</div>

<div class="s13w4-met">
<div class="s13w4-box"><span id="s13w4-l1"></span><span class="s13w4-rd" id="s13w4-r1"></span></div>
<div class="s13w4-box"><span id="s13w4-l2"></span><span class="s13w4-rd" id="s13w4-r2"></span></div>
<div class="s13w4-box"><span id="s13w4-l3"></span><span class="s13w4-rd" id="s13w4-r3"></span></div>
</div>
<div class="s13w4-box s13w4-tbox">
  <div class="s13w4-trow"><span class="s13w4-tl" id="s13w4-tl"></span><span class="s13w4-rd" id="s13w4-r4"></span></div>
  <div class="s13w4-tk"><div class="s13w4-fl" id="s13w4-fl"></div></div>
  <div class="s13w4-ax" id="s13w4-ax"></div>
</div>
<p class="s13w4-note" id="s13w4-note"></p>
</main>

<script>
(function(){
'use strict';
var COL=['#0891b2','#7c3aed','#2563eb','#db2777','#0e7490','#9333ea','#475569','#c026d3'],
    GREEN='#159447',AMBER='#d97706',RED='#dc2626',VIO='#7c3aed',INK='#152033',MUT='#65758b',
    GPUS=64,PER=8,HID=8192,SEQ=5120,BYTES=2,TENSOR=HID*SEQ*BYTES,LAYERS=96,ARS=4,
    NODES={h100:{name:'H100',nvl:'NVLink 4',bw:450e9},b200:{name:'B200',nvl:'NVLink 5',bw:900e9}},NIC=50e9,AXMAX=1.5,GRAD=60.4e9,
    t=8,view='tp',node='h100',
    X0=4,NW=130,GAP=(1128-8*NW)/7,BY=22,BH=60,SQ=11,P=15,GY=42,RY=188,RH=26,RW=118;
function $(i){return document.getElementById('s13w4-'+i);}
function ring(n){return 2*(n-1)/n;}
function ringTxt(n){return '2('+n+' &minus; 1)/'+n;}
function tpTraffic(n){return ARS*TENSOR*ring(n)*LAYERS;}
function gradBytes(){return GRAD;} /* full model gradients in 16-bit */
function gb1(b){return (b/1e9).toFixed(1)+' GB';}
function gb2(b){return (b/1e9).toFixed(2)+' GB';}
function mb1(b){return (b/1e6).toFixed(1)+' MB';}
function pc(v){return Math.min(100,v/AXMAX*100);}
function nx(n){return X0+n*(NW+GAP);}
function gx(i){return nx(Math.floor(i/PER))+(NW-(7*P+SQ))/2+(i%PER)*P;}
function gcx(i){return gx(i)+SQ/2;}
function rx(k){return nx(k)+(NW-RW)/2;}
function tx(x,y,s,c,a,z,w){return '<text x="'+x+'" y="'+y+'" text-anchor="'+(a||'middle')+'" font-size="'+(z||11)+'" font-weight="'+(w||700)+'" fill="'+c+'">'+s+'</text>';}
function partner(i){return i%t===0;} /* same position as GPU 0 inside each copy */
function svg(){
  var s='',n,k,i,g,a,b,x0,x1,cross=(view==='tp'&&t>PER),railOn=[],c,w,hi;
  for(k=0;k<PER;k++){railOn[k]=view==='tp'?cross:partner(k);}
  /* rail lines */
  for(n=0;n<PER;n++){for(k=0;k<PER;k++){
    i=n*PER+k;
    if(view==='tp'){hi=cross;c=cross?AMBER:'#c3cfdd';w=cross?1.3:0.8;}
    else{hi=partner(i);c=hi?VIO:'#dbe3ee';w=hi?1.8:0.8;}
    s+='<line x1="'+gcx(i)+'" y1="'+(BY+BH)+'" x2="'+(rx(k)+10+n*(RW-20)/7)+'" y2="'+RY+'" stroke="'+c+'" stroke-width="'+w+'"'+(hi?'':' opacity=".9"')+'/>';
  }}
  /* rail switches */
  for(k=0;k<PER;k++){
    c=railOn[k]?(view==='tp'?AMBER:VIO):'#93a3b6';
    s+='<rect x="'+rx(k)+'" y="'+RY+'" width="'+RW+'" height="'+RH+'" rx="7" fill="'+(railOn[k]?(view==='tp'?'#fffaf2':'#f5f3ff'):'#f8fafc')+'" stroke="'+c+'" stroke-width="'+(railOn[k]?1.8:1.2)+'"/>';
    s+=tx(rx(k)+RW/2,RY+17,'rail '+k,railOn[k]?c:MUT,'middle',11,800);
  }
  /* nodes */
  for(n=0;n<PER;n++){
    s+='<rect x="'+nx(n)+'" y="'+BY+'" width="'+NW+'" height="'+BH+'" rx="8" fill="#f8fafc" stroke="'+INK+'" stroke-width="1.2"/>';
    s+=tx(nx(n)+8,BY+13,'node '+n,MUT,'start',10,800);
    for(k=0;k<PER;k++){s+=tx(gcx(n*PER+k),GY+SQ+18,String(k),'#93a3b6','middle',8.5,700);}
  }
  /* GPUs and groups */
  for(g=0;g<GPUS/t;g++){
    a=g*t;b=a+t-1;
    for(i=a;i<=b;i++){
      if(view==='tp'){c=COL[g%8];}
      else{c=i===0?INK:(partner(i)?VIO:'#d5dde8');}
      s+='<rect x="'+gx(i)+'" y="'+GY+'" width="'+SQ+'" height="'+SQ+'" rx="2.5" fill="'+c+'"/>';
    }
    x0=gx(a)-2.5;x1=gx(b)+SQ+2.5;
    if(view==='tp'){
      for(n=Math.floor(a/PER);n<=Math.floor(b/PER);n++){
        var p=Math.max(a,n*PER),q=Math.min(b,n*PER+PER-1);
        s+='<line x1="'+gcx(p)+'" y1="'+(GY+SQ+4)+'" x2="'+gcx(q)+'" y2="'+(GY+SQ+4)+'" stroke="'+GREEN+'" stroke-width="2.2" stroke-linecap="round"/>';
        for(i=p;i<=q;i++){s+='<line x1="'+gcx(i)+'" y1="'+(GY+SQ)+'" x2="'+gcx(i)+'" y2="'+(GY+SQ+4)+'" stroke="'+GREEN+'" stroke-width="1.2"/>';}
      }
      s+='<rect x="'+x0+'" y="'+(GY-2.5)+'" width="'+(x1-x0)+'" height="'+(SQ+5)+'" rx="4" fill="none" stroke="'+(cross?RED:GREEN)+'" stroke-width="'+(cross?2.2:1.4)+'"/>';
      if(cross){s+=tx((x0+x1)/2,14,'crosses the network',RED,'middle',11,800);}
    }else{
      s+='<rect x="'+x0+'" y="'+(GY-2.5)+'" width="'+(x1-x0)+'" height="'+(SQ+5)+'" rx="4" fill="none" stroke="#b9c6d6" stroke-width="1"/>';
    }
  }
  if(view==='dp'){s+=tx(gcx(0)-4,14,'GPU 0 in node 0',INK,'start',10.5,800);}
  $('svg').innerHTML=s;
}
function axis(){
  var s='',i;
  for(i=0;i<=6;i++){s+='<i style="left:'+(i/6*100)+'%">'+(i*0.25).toFixed(2)+' s</i>';}
  $('ax').innerHTML=s;
}
function draw(){
  var d=GPUS/t,sec,col;
  svg();
  $('r1').innerHTML='<b>'+d+'</b> = 64 / '+t;
  $('l1').textContent='data-parallel degree';
  if(view==='tp'){
    var nd=NODES[node],cross=t>PER,tr=tpTraffic(t),bw=cross?NIC:nd.bw;
    sec=tr/bw;col=cross?RED:GREEN;
    $('say').innerHTML='Each outline marks one <b>tensor-parallel group of '+t+' GPUs</b>.<br>Thin lines join GPU position k of every node to <b>rail switch k</b>.';
    $('h2').textContent='64 GPUs in 8 '+nd.name+' nodes, tensor-parallel groups of '+t;
    $('leg').innerHTML='Green bars are <b>'+nd.nvl+' at '+(nd.bw/1e9)+' GB/s</b> each way inside '+(node==='h100'?'an':'a')+' '+nd.name+' node. Each GPU has one <b>400 Gb/s network card</b>, which is <b>50 GB/s</b> each way. Card k of every node connects to rail switch k.';
    $('l2').textContent='tensor-parallel traffic per sequence';
    $('r2').innerHTML='<b>'+gb1(tr)+'</b> = 4 &times; '+mb1(TENSOR)+' &times; '+ringTxt(t)+' &times; 96';
    $('l3').textContent='link used by each group';
    $('r3').innerHTML='<b style="color:'+col+'">'+(cross?'network card':nd.nvl)+'</b> at '+(bw/1e9)+' GB/s';
    $('tl').textContent='time per sequence, pinned axis from 0 to 1.5 s';
    $('r4').innerHTML='<b style="color:'+col+'">'+(sec<1?sec.toFixed(3):sec.toFixed(2))+' s</b> = '+gb1(tr)+' / '+(bw/1e9)+' GB/s';
    $('note').innerHTML=cross
      ?'<span style="color:'+RED+'">A degree of 16 needs copies of the 8 key-value heads.</span><span style="color:#b45309">This time assumes the traffic goes through each GPU\'s own network card. NCCL spreads it across all eight cards, and Megatron-LM found tensor parallelism best kept within one server.</span>'
      :'<span style="color:'+GREEN+'">Every group of '+t+' GPUs sits inside one '+nd.name+' node on '+nd.nvl+'.</span>';
  }else{
    var gr=gradBytes()/t,dt=gr*ring(d);
    sec=dt/NIC;col=VIO;
    $('say').innerHTML='Violet GPUs are the <b>data-parallel partners</b> of GPU 0 in node 0.<br>Each partner holds the same slice of the model in another copy.';
    $('h2').textContent='64 GPUs in 8 '+NODES[node].name+' nodes, '+d+' data-parallel copies of '+t+' GPUs';
    $('leg').innerHTML='The dark square is <b>GPU 0 in node 0</b>. Violet squares sit at its position in the other copies. Violet lines are the <b>rails</b> their gradient traffic uses.';
    $('l2').textContent='gradients held per GPU in 16-bit';
    $('r2').innerHTML='<b>'+gb2(gr)+'</b> = '+gb1(gradBytes())+' / '+t;
    $('l3').textContent='data-parallel traffic per GPU per step';
    $('r3').innerHTML='<b>'+gb1(dt)+'</b> = '+gb2(gr)+' &times; '+ringTxt(d);
    $('tl').textContent='time through one network card, pinned axis from 0 to 1.5 s';
    $('r4').innerHTML='<b style="color:'+col+'">'+sec.toFixed(2)+' s</b> = '+gb1(dt)+' / 50 GB/s';
    $('note').innerHTML='<span style="color:'+VIO+'">Partners at the same position use the same rail, so their traffic crosses one switch.'+(t<8?' Partners inside node 0 are reached over NVLink.':'')+'</span>';
  }
  $('fl').style.width=pc(sec)+'%';$('fl').style.background=col;
}
function marks(){
  Array.prototype.forEach.call(document.querySelectorAll('.s13w4-t'),function(b){b.classList.toggle('on',+b.getAttribute('data-v')===t);});
  Array.prototype.forEach.call(document.querySelectorAll('.s13w4-n'),function(b){b.classList.toggle('on',b.getAttribute('data-v')===node);});
  Array.prototype.forEach.call(document.querySelectorAll('.s13w4-d'),function(b){b.classList.toggle('on',b.getAttribute('data-v')===view);});
}
Array.prototype.forEach.call(document.querySelectorAll('.s13w4-t'),function(b){
  b.addEventListener('click',function(){t=+b.getAttribute('data-v');marks();draw();});
});
Array.prototype.forEach.call(document.querySelectorAll('.s13w4-d'),function(b){
  b.addEventListener('click',function(){view=b.getAttribute('data-v');marks();draw();});
});
Array.prototype.forEach.call(document.querySelectorAll('.s13w4-n'),function(b){
  b.addEventListener('click',function(){node=b.getAttribute('data-v');marks();draw();});
});
axis();marks();draw();
}());
</script>
<script>
(function(){
  var fe; try{ fe=window.frameElement; }catch(e){ return; }
  if(!fe) return;
  var last=0;
  function fit(){ var h=Math.ceil(document.body.scrollHeight)+8; if(Math.abs(h-last)>2){ last=h; fe.style.height=h+'px'; } }
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.body); }
  window.addEventListener('load',fit);
  document.addEventListener('click',function(){ setTimeout(fit,60); setTimeout(fit,260); },true);
  document.addEventListener('input',function(){ setTimeout(fit,60); },true);
  [0,120,400,900,1800].forEach(function(t){ setTimeout(fit,t); });
})();
</script>
</body>
</html>
