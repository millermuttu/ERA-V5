<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 16 Figure 4 - A Scaling Ladder and Its Forecast</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#152033;--muted:#65758b;--line:#d9e2ef;--cyan:#0891b2;--violet:#7c3aed;--green:#159447;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,#f8fbff,#eef5fb);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.s16f4-w{max-width:1180px;margin:0 auto;padding:16px 22px 16px}
.s16f4-k{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.s16f4-w h1{font-size:22px;line-height:1.15;margin:3px 0 12px}
.s16f4-card{position:relative;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(20,42,75,.07);padding:14px 16px 12px}
.s16f4-card svg{display:block;width:100%;height:auto;overflow:visible}
.s16f4-card svg text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.s16f4-note{margin:10px 2px 0;font-size:13px;line-height:1.5;color:var(--muted)}
.s16f4-note b{color:var(--ink)}
.s16f4-tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 22px rgba(20,42,75,.13);padding:8px 11px;font:600 13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink);white-space:nowrap;z-index:5}
.s16f4-tip b{font-family:Inter,sans-serif;font-weight:800}
.s16f4-tip span{color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<main class="s16f4-w">
<div class="s16f4-k">ERA V5 Session 16 &middot; the scaling ladder</div>
<h1>A Scaling Ladder and Its Forecast</h1>
<div class="s16f4-card" id="s16f4-card"><svg id="s16f4-svg" viewBox="0 0 1100 392" role="img" aria-label="A scaling ladder: five rungs, a power-law fit, a band that widens to the right, a held-out rung inside the band, and a star for the large run."></svg><div class="s16f4-tip" id="s16f4-tip" hidden></div></div>
<p class="s16f4-note">Illustrative numbers from a seeded generator. The fit is <b>BPB = E + a &middot; C<sup>&minus;b</sup></b> on rungs 1 to 5. The band holds 90% of 400 bootstrap fits. Hover to read the values.</p>

</main>
<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var CS=getComputedStyle(document.documentElement);
var K={};['ink','muted','line','cyan','violet','green','amber','red'].forEach(function(n){K[n]=CS.getPropertyValue('--'+n).trim();});
function $(i){return document.getElementById('s16f4-'+i);}
function el(t,a,p){var e=document.createElementNS(NS,t);if(a){for(var k in a){if(a[k]!==undefined&&a[k]!==null)e.setAttribute(k,a[k]);}}if(p)p.appendChild(e);return e;}
function tx(p,x,y,s,a){a=a||{};a.x=x;a.y=y;var e=el('text',a,p);e.textContent=s;return e;}
var SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function p10(e){return '10'+String(e).split('').map(function(c){return SUP[c];}).join('');}
function sci(v){var e=Math.floor(Math.log10(v)+1e-9),m=v/Math.pow(10,e);return (Math.abs(m-1)<1e-6?'':(m.toFixed(1).replace(/\.0$/,'')+' × '))+p10(e);}
function big(v){var u=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];for(var i=0;i<u.length;i++){if(v>=u[i][0]){var x=v/u[i][0];return (x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2))+u[i][1];}}return v.toFixed(0);}
function lg(lo,hi,a,b){var l0=Math.log10(lo),l1=Math.log10(hi);var f=function(v){return a+(Math.log10(v)-l0)/(l1-l0)*(b-a);};f.inv=function(px){return Math.pow(10,l0+(px-a)/(b-a)*(l1-l0));};return f;}
function ln(lo,hi,a,b){var f=function(v){return a+(v-lo)/(hi-lo)*(b-a);};f.inv=function(px){return lo+(px-a)/(b-a)*(hi-lo);};return f;}
function tipAt(tip,card,html,cx,cy){tip.innerHTML=html;tip.hidden=false;var w=tip.offsetWidth,h=tip.offsetHeight,W=card.clientWidth;var x=cx+16,y=cy-h-12;if(x+w>W-6)x=cx-w-16;if(y<6)y=cy+16;tip.style.left=x+'px';tip.style.top=y+'px';}
function svgPt(svg,ev){var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return {x:(ev.clientX-r.left)*vb.width/r.width,y:(ev.clientY-r.top)*vb.height/r.height,s:r.width/vb.width,ox:r.left,oy:r.top};}
function cardPt(card,ev){var r=card.getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top};}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var SEED=13,R=rng(SEED),E=0.40;
function truth(C){return E+0.75*Math.pow(C/1e19,-0.10);}
function gauss(){var u=R()||1e-9,v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
var RC=[1e19,Math.pow(10,19.5),1e20,Math.pow(10,20.5),1e21],HC=Math.pow(10,21.5),BIG=1e24;
var pts=RC.map(function(C){return {C:C,b:truth(C)*(1+0.006*gauss())};});
var held={C:HC,b:truth(HC)*(1+0.006*gauss())};
function fit(ps){var n=ps.length,sx=0,sy=0,sxx=0,sxy=0;ps.forEach(function(p){var X=Math.log10(p.C),Y=Math.log10(p.b-E);sx+=X;sy+=Y;sxx+=X*X;sxy+=X*Y;});var d=n*sxx-sx*sx;if(Math.abs(d)<1e-9)return null;var s=(n*sxy-sx*sy)/d;return {s:s,i:(sy-s*sx)/n};}
function pred(f,C){return E+Math.pow(10,f.i+f.s*Math.log10(C));}
var F=fit(pts),BS=[];
for(var r=0;r<400;r++){var smp=[];for(var j=0;j<pts.length;j++)smp.push(pts[Math.floor(R()*pts.length)]);var f=fit(smp);if(f)BS.push(f);}
function band(C){var v=BS.map(function(f){return pred(f,C);}).sort(function(a,b){return a-b;});return [v[Math.floor(0.05*v.length)],v[Math.floor(0.95*v.length)]];}
var svg=$('svg'),card=$('card'),tip=$('tip');
var X0=78,X1=1040,Y0=16,Y1=330;
var x=lg(4e18,4e24,X0,X1),y=ln(0.55,1.2,Y1,Y0);
var g=el('g',null,svg);
for(var e=19;e<=24;e++){el('line',{x1:x(Math.pow(10,e)),x2:x(Math.pow(10,e)),y1:Y0,y2:Y1,stroke:K.line},g);tx(g,x(Math.pow(10,e)),Y1+22,p10(e),{'text-anchor':'middle','font-size':13.5,fill:K.muted});}
for(var t=0.6;t<=1.201;t+=0.1){el('line',{x1:X0,x2:X1,y1:y(t),y2:y(t),stroke:K.line},g);tx(g,X0-10,y(t)+4.5,t.toFixed(1),{'text-anchor':'end','font-size':13,fill:K.muted});}
el('line',{x1:X0,x2:X1,y1:Y1,y2:Y1,stroke:K.muted,'stroke-opacity':0.6},g);el('line',{x1:X0,x2:X0,y1:Y0,y2:Y1,stroke:K.muted,'stroke-opacity':0.6},g);
tx(g,(X0+X1)/2,Y1+48,'training compute C (FLOPs, log scale)',{'text-anchor':'middle','font-size':13.5,'font-weight':700,fill:K.ink});
tx(g,24,(Y0+Y1)/2,'validation BPB',{'text-anchor':'middle','font-size':13.5,'font-weight':700,fill:K.ink,transform:'rotate(-90 24 '+((Y0+Y1)/2)+')'});
// ladder region
el('rect',{x:x(1e19)-14,y:Y0,width:x(1e21)-x(1e19)+28,height:Y1-Y0,fill:K.cyan,'fill-opacity':0.04},g);
// band
var up='',dn='',n=160,lo=19,hi=Math.log10(2e24),k,C;
for(k=0;k<=n;k++){C=Math.pow(10,lo+k/n*(hi-lo));var bd=band(C);up+=(k?'L':'M')+x(C).toFixed(1)+' '+y(bd[1]).toFixed(1);dn='L'+x(C).toFixed(1)+' '+y(bd[0]).toFixed(1)+dn;}
el('path',{d:up+dn+'Z',fill:K.cyan,'fill-opacity':0.13,stroke:K.cyan,'stroke-opacity':0.3,'stroke-width':1},g);
var fd1='',fd2='';
for(k=0;k<=n;k++){C=Math.pow(10,lo+k/n*(hi-lo));var s=x(C).toFixed(1)+' '+y(pred(F,C)).toFixed(1);if(C<=1.05e21)fd1+=(fd1?'L':'M')+s;if(C>=0.95e21)fd2+=(fd2?'L':'M')+s;}
el('path',{d:fd1,fill:'none',stroke:K.cyan,'stroke-width':2.4},g);
el('path',{d:fd2,fill:'none',stroke:K.cyan,'stroke-width':2.2,'stroke-dasharray':'7 6'},g);
// rungs
pts.forEach(function(p,i){el('circle',{cx:x(p.C),cy:y(p.b),r:6.5,fill:K.cyan,stroke:'#fff','stroke-width':2},g);});
tx(g,x(pts[0].C),y(pts[0].b)+28,'rung 1',{'text-anchor':'middle','font-size':13,'font-weight':700,fill:K.cyan});
tx(g,x(pts[4].C)+2,y(pts[4].b)-16,'rung 5',{'text-anchor':'middle','font-size':13,'font-weight':700,fill:K.cyan});
// held out
var hb=band(HC);
el('circle',{cx:x(HC),cy:y(held.b),r:7,fill:'#fff',stroke:K.violet,'stroke-width':2.6},g);
var hy=y(0.71);
el('path',{d:'M'+x(HC)+' '+(y(held.b)+9)+'V'+(hy-4.5)+'H'+(x(HC)-10),fill:'none',stroke:K.violet,'stroke-width':1.2},g);
tx(g,x(HC)-14,hy,'rung 6 is held out and lands inside the band',{'text-anchor':'end','font-size':13,'font-weight':800,fill:K.violet});
tx(g,x(HC)-14,hy+18,'predicted '+pred(F,HC).toFixed(3)+', measured '+held.b.toFixed(3),{'text-anchor':'end','font-size':13,fill:K.muted});
// star
var sb=band(BIG),sx=x(BIG),sy=y(pred(F,BIG));
el('line',{x1:sx,x2:sx,y1:y(sb[0]),y2:y(sb[1]),stroke:K.amber,'stroke-width':2},g);
[sb[0],sb[1]].forEach(function(v){el('line',{x1:sx-7,x2:sx+7,y1:y(v),y2:y(v),stroke:K.amber,'stroke-width':2},g);});
function star(cx,cy,R1,R2){var d='';for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?R2:R1;d+=(i?'L':'M')+(cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1);}return d+'Z';}
el('path',{d:star(sx,sy,13,5.5),fill:K.amber,stroke:'#fff','stroke-width':1.5,'stroke-linejoin':'round'},g);
tx(g,sx,y(sb[1])-34,'the large run',{'text-anchor':'middle','font-size':13.5,'font-weight':800,fill:K.amber});
tx(g,sx,y(sb[1])-16,'BPB '+pred(F,BIG).toFixed(3)+' (band '+sb[0].toFixed(3)+' to '+sb[1].toFixed(3)+')',{'text-anchor':'middle','font-size':13,fill:K.muted});
// top labels
tx(g,(x(1e19)+x(1e21))/2,Y1-14,'the ladder: 5 rungs over 2 orders of magnitude',{'text-anchor':'middle','font-size':13,'font-weight':700,fill:K.cyan});
el('rect',{x:X1-150,y:Y0+4,width:142,height:24,rx:12,fill:K.amber,'fill-opacity':0.1,stroke:K.amber,'stroke-opacity':0.4},g);
tx(g,X1-79,Y0+20.5,'illustrative numbers',{'text-anchor':'middle','font-size':12.5,'font-weight':800,fill:K.amber});
// hover
var hv=el('g',{'pointer-events':'none'},svg),hd=el('circle',{r:5,fill:'#fff',stroke:K.ink,'stroke-width':2},hv);hv.style.display='none';
var hit=el('rect',{x:X0,y:Y0,width:X1-X0,height:Y1-Y0,fill:'transparent'},svg);
var P2=pts.map(function(p,i){return {C:p.C,b:p.b,n:'rung '+(i+1)+' (fit)'};}).concat([{C:HC,b:held.b,n:'rung 6 (held out)'}]);
hit.addEventListener('mousemove',function(ev){
  var p=svgPt(svg,ev),cp=cardPt(card,ev),best=null,bd=22;
  P2.forEach(function(q){var d=Math.hypot(x(q.C)-p.x,y(q.b)-p.y);if(d<bd){bd=d;best=q;}});
  var C=best?best.C:x.inv(p.x);if(C<1e19||C>2e24){hv.style.display='none';tip.hidden=true;return;}
  var f=pred(F,C),b=band(C);
  hv.style.display='';hd.setAttribute('cx',x(C));hd.setAttribute('cy',y(best?best.b:f));
  var h='<b>'+(best?best.n:(Math.abs(Math.log10(C/BIG))<0.08?'the large run':'fit line'))+'</b><br>C = '+sci(C)+' <span>FLOPs</span>';
  if(best)h+='<br>measured BPB = '+best.b.toFixed(3);
  h+='<br>fit BPB = '+f.toFixed(3)+'<br>band = '+b[0].toFixed(3)+' to '+b[1].toFixed(3);
  tipAt(tip,card,h,cp.x,cp.y);
});
hit.addEventListener('mouseleave',function(){hv.style.display='none';tip.hidden=true;});

}());
</script>
<script>
(function(){
  var fe; try{ fe=window.frameElement; }catch(e){ return; }
  if(!fe) return;
  var last=0;
  function fit(){ var h=Math.ceil(document.body.scrollHeight)+8; if(Math.abs(h-last)>2){ last=h; fe.style.height=h+'px'; } }
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.body); }
  window.addEventListener('load',fit);
  document.addEventListener('click',function(){ setTimeout(fit,60); setTimeout(fit,260); },true);
  document.addEventListener('input',function(){ setTimeout(fit,60); },true);
  [0,120,400,900,1800].forEach(function(t){ setTimeout(fit,t); });
})();
</script>
</body>
</html>
