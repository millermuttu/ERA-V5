<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 16 Figure 5 - The Five-Step Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#152033;--muted:#65758b;--line:#d9e2ef;--cyan:#0891b2;--violet:#7c3aed;--green:#159447;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,#f8fbff,#eef5fb);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.s16f5-w{max-width:1180px;margin:0 auto;padding:16px 22px 16px}
.s16f5-k{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.s16f5-w h1{font-size:22px;line-height:1.15;margin:3px 0 12px}
.s16f5-card{position:relative;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(20,42,75,.07);padding:14px 16px 12px}
.s16f5-card svg{display:block;width:100%;height:auto;overflow:visible}
.s16f5-card svg text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.s16f5-note{margin:10px 2px 0;font-size:13px;line-height:1.5;color:var(--muted)}
.s16f5-note b{color:var(--ink)}
.s16f5-tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 22px rgba(20,42,75,.13);padding:8px 11px;font:600 13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink);white-space:nowrap;z-index:5}
.s16f5-tip b{font-family:Inter,sans-serif;font-weight:800}
.s16f5-tip span{color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.s16f5-steps{position:relative;padding:4px 0 2px}
.s16f5-row{position:relative;display:grid;grid-template-columns:58px 390px 1fr 190px;align-items:center;column-gap:18px;padding:9px 0}
.s16f5-row+.s16f5-row{border-top:1px dashed #e6edf5}
.s16f5-rail{position:absolute;left:28px;top:34px;bottom:34px;width:2px;background:var(--line)}
.s16f5-num{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid currentColor;margin-left:5px}
.s16f5-num svg{width:22px;height:22px;display:block}
.s16f5-num i{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:currentColor;font:800 11.5px/20px Inter,sans-serif;font-style:normal;text-align:center}
.s16f5-num i span{color:#fff}
.s16f5-t{font-size:16px;font-weight:800;letter-spacing:.01em;margin:0 0 2px}
.s16f5-d{font-size:13.5px;line-height:1.45;color:var(--muted);margin:0}
.s16f5-chip{font:700 13.5px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace;border-radius:9px;padding:9px 13px;border:1px solid;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.s16f5-out{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink)}
.s16f5-out svg{flex:none;width:26px;height:12px}

</style>
</head>
<body>
<main class="s16f5-w">
<div class="s16f5-k">ERA V5 Session 16 &middot; capstone plan</div>
<h1>The Five-Step Plan</h1>
<div class="s16f5-card"><div class="s16f5-steps" id="s16f5-steps" role="list" aria-label="The five steps of the plan"><div class="s16f5-rail" aria-hidden="true"></div></div></div>

</main>
<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var CS=getComputedStyle(document.documentElement);
var K={};['ink','muted','line','cyan','violet','green','amber','red'].forEach(function(n){K[n]=CS.getPropertyValue('--'+n).trim();});
function $(i){return document.getElementById('s16f5-'+i);}
function el(t,a,p){var e=document.createElementNS(NS,t);if(a){for(var k in a){if(a[k]!==undefined&&a[k]!==null)e.setAttribute(k,a[k]);}}if(p)p.appendChild(e);return e;}
function tx(p,x,y,s,a){a=a||{};a.x=x;a.y=y;var e=el('text',a,p);e.textContent=s;return e;}
var SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function p10(e){return '10'+String(e).split('').map(function(c){return SUP[c];}).join('');}
function sci(v){var e=Math.floor(Math.log10(v)+1e-9),m=v/Math.pow(10,e);return (Math.abs(m-1)<1e-6?'':(m.toFixed(1).replace(/\.0$/,'')+' × '))+p10(e);}
function big(v){var u=[[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];for(var i=0;i<u.length;i++){if(v>=u[i][0]){var x=v/u[i][0];return (x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2))+u[i][1];}}return v.toFixed(0);}
function lg(lo,hi,a,b){var l0=Math.log10(lo),l1=Math.log10(hi);var f=function(v){return a+(Math.log10(v)-l0)/(l1-l0)*(b-a);};f.inv=function(px){return Math.pow(10,l0+(px-a)/(b-a)*(l1-l0));};return f;}
function ln(lo,hi,a,b){var f=function(v){return a+(v-lo)/(hi-lo)*(b-a);};f.inv=function(px){return lo+(px-a)/(b-a)*(hi-lo);};return f;}
function tipAt(tip,card,html,cx,cy){tip.innerHTML=html;tip.hidden=false;var w=tip.offsetWidth,h=tip.offsetHeight,W=card.clientWidth;var x=cx+16,y=cy-h-12;if(x+w>W-6)x=cx-w-16;if(y<6)y=cy+16;tip.style.left=x+'px';tip.style.top=y+'px';}
function svgPt(svg,ev){var r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return {x:(ev.clientX-r.left)*vb.width/r.width,y:(ev.clientY-r.top)*vb.height/r.height,s:r.width/vb.width,ox:r.left,oy:r.top};}
function cardPt(card,ev){var r=card.getBoundingClientRect();return {x:ev.clientX-r.left,y:ev.clientY-r.top};}
var S=[
 {c:K.cyan,ic:'chip',t:'Budget',d:'Count the compute that the model really gets.',f:'C = GPUs × days × peak × MFU × goodput',o:'C in FLOPs'},
 {c:K.violet,ic:'scale',t:'Size',d:'Choose a TPP. Then solve for N and D.',f:'C = 6 · N · D,   D = TPP · N',o:'N active, D tokens'},
 {c:K.green,ic:'stack',t:'Check data',d:'Count the epochs. Up to 4 epochs is almost free.',f:'epochs = D / unique tokens',o:'epochs per source'},
 {c:K.amber,ic:'ladder',t:'Ladder',d:'Train 5 to 8 rungs: same TPP, same shape rule, source scaling. Fit the LR and WD laws on the lower rungs.',f:'LR* · WD* = 17.04 / steps',o:'fitted laws and a band'},
 {c:K.red,ic:'check',t:'Held-out check',d:'Predict the top rung first. Trust the forecast only if the rung lands inside the band.',f:'measured BPB of the top rung ∈ band',o:'start the large run'}
];
var IC={
 chip:'<rect x="6" y="6" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="9.5" y="9.5" width="5" height="5" rx="1" fill="currentColor"/><path d="M9 2.5V6M12 2.5V6M15 2.5V6M9 18v3.5M12 18v3.5M15 18v3.5M2.5 9H6M2.5 12H6M2.5 15H6M18 9h3.5M18 12h3.5M18 15h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
 scale:'<path d="M12 3.5V20M6 20h12M4 7.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 7.5 1.8 13.5h4.4zM20 7.5l-2.2 6h4.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
 stack:'<ellipse cx="12" cy="5.5" rx="7.5" ry="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 5.5v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V5.5M4.5 12v6.5c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V12" fill="none" stroke="currentColor" stroke-width="1.8"/>',
 ladder:'<path d="M7 2.5v19M17 2.5v19M7 7h10M7 12h10M7 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
 check:'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m7.5 12.3 3 3 6-6.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
};
function hexA(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')';}
var box=$('steps');
S.forEach(function(s,i){
  var r=document.createElement('div');r.className='s16f5-row';r.setAttribute('role','listitem');
  r.innerHTML='<div class="s16f5-num" style="color:'+s.c+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+IC[s.ic]+'</svg><i><span>'+(i+1)+'</span></i></div>'+
   '<div><p class="s16f5-t">'+s.t+'</p><p class="s16f5-d">'+s.d+'</p></div>'+
   '<div class="s16f5-chip" style="color:'+s.c+';border-color:'+hexA(s.c,0.35)+';background:'+hexA(s.c,0.07)+'"></div>'+
   '<div class="s16f5-out"><svg viewBox="0 0 26 12" aria-hidden="true"><path d="M1 6h21M17 1.5 22.5 6 17 10.5" fill="none" stroke="'+K.muted+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span></div>';
  r.querySelector('.s16f5-chip').textContent=s.f;r.querySelector('.s16f5-out span').textContent=s.o;
  box.appendChild(r);
});

}());
</script>
<script>
(function(){
  var fe; try{ fe=window.frameElement; }catch(e){ return; }
  if(!fe) return;
  var last=0;
  function fit(){ var h=Math.ceil(document.body.scrollHeight)+8; if(Math.abs(h-last)>2){ last=h; fe.style.height=h+'px'; } }
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(document.body); }
  window.addEventListener('load',fit);
  document.addEventListener('click',function(){ setTimeout(fit,60); setTimeout(fit,260); },true);
  document.addEventListener('input',function(){ setTimeout(fit,60); },true);
  [0,120,400,900,1800].forEach(function(t){ setTimeout(fit,t); });
})();
</script>
</body>
</html>
